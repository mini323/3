 ['一句感受与触发它的具体事情，不评价对方人格','一句“我观察到____，我希望____”的草稿，暂不发送','一句待核实的事实，把“总是／从不”改成具体一次','一个删去指责词的短句，作为这次表达练习的完成稿'],
 ['一处让你紧绷或放松的边界，以及身体或情绪的感受','一句“我愿意____，但不接受____”的草稿，先留给自己','一项你能控制与一项不能控制的行为，分开放置','一条自己能落实的边界，例如暂时不查看消息，而非要求对方改变'],
 ['一种担忧和引起它的事实，允许原因暂时未知','一句不预设答案的问句草稿，先不发给任何人','一条信息的标签：已知事实／个人解释／尚待确认','一条待确认的信息与可靠来源，先记下，不试探对方']
];
function normalizedMicro(c){return c.micro_action
 .replace('给一位可靠朋友发一句不涉及伴侣隐私的问候。','拟一句给可靠朋友的问候，暂不发送，也不涉及他人隐私。')
 .replace(/未来一周|本周|今天|近期/g,'这次')
 .replace(/二十分钟|十五分钟|十分钟|五分钟|一分钟/g,'几分钟');}
function buildPlan(){
 const cards=S.picks.map(id=>byId.get(id)),[state,need,obstacle,resource,action]=cards;
 const lens=THEME_LENS[S.theme],contact=S.contact||0,fit=S.fit||0;
 // Card text is editorial content. No free-text inference, scoring, or clinical classification.
 const micro=normalizedMicro(action);
 let title=['先看清，再决定要不要做','先拟好一句话，不急着发','先核对一个卡点','先做一件可以停下的小事'][S.help];
 let task=micro;
 let script=lens.frame;
 let why=`「${action.name}」在行动位，借它的「${action.keywords[0]}」把想法缩成上面这一步。你选了「${THEMES[S.theme][0]}」，因此只把它用在${lens.focus}，不推导整段关系的结局。`;
 const gate=contact===1?'只有双方此刻都愿意、你感到安全时，才考虑交流。先征询意愿；拒绝、沉默或改期都不是继续追问的许可。':contact===2?'你选择了暂停联系／对方不愿谈：本次只做自己的整理，不发送草稿，不换账号、不托人传话。':'目前并未确认适合联系：先留在自己的记录里。不要根据牌面试探、催促或安排见面。';
 if(S.help===1){title='先把需要写成一句能留下来的话';task=`用这张行动牌做草稿准备：${micro}完成后只保留一句与你的需要有关的话，先不发送。`;}
 if(S.help===2){title='先核对一处，再决定下一步';task=`围绕${lens.focus}，从下面的行动中只检查一项：${micro}凡是涉及对方动机的解释，先标为“未确认”。`;}
 if(contact===2){title='这一步，不需要对方参与';task=`给自己最多十分钟：${micro}如果其中涉及共同安排，只写下自己的部分，不联系对方落实。`;}
 if(contact!==3){task+=`完成时，只留下：${PLAN_OUTPUTS[S.theme][S.help]}。`;}
 if(fit===1){title='不贴合，就从你确认的事开始';task=`不用迁就牌面。围绕${lens.focus}，写下一件你亲历的具体事情，再写一个只由自己决定的小调整。`;why='你选择了“暂不贴合”，因此不再用牌义推导行动。五张牌仍保持原样，仅保留为可选的反思材料。';}
 if(contact===3){title='先让自己有安全与余地';task='这次不把联系、对质或修复关系设为任务。若当下有威胁或伤害，先到你认为安全的位置，并在安全可行时联系当地紧急帮助或可信赖的人；不需要先完成这份阅读。';script='给自己的许可：我可以暂停回应，也不必现在解释或作决定。';why='这是你明确选择的现实条件，不是牌面判定。安全与自主意愿优先，所以即使行动牌象征靠近，也不建议推进联系。';}
 const timing=S.time===3?'不设完成期限。愿意时留十分钟；不做也可以。':['接下来一周内','接下来两周内','接下来一个月内'][S.time]+'，选一个有余力的十分钟，只试一次；无需每天打卡。';
 const review=S.time===3?'在你愿意再次打开这份记录时回看。':['一周后','两周后','一个月后'][S.time]+'回看一次；若条件改变，可提前停止。';
 return {cards,lens,contact,fit,title,task,script,why,gate,timing,review,micro,
  thread:`「${need.name}」在需要位，提示你检查「${need.keywords[0]}」是否重要；「${obstacle.name}」在阻力位，则提醒留意「${obstacle.keywords[0]}」是否让这件事变难。两者只是自查角度，不证明你们确实存在这些问题。`,
  support:`「${resource.name}」在资源位：${resource.positions.resource}`};
}
function summary(){const p=buildPlan();return{title:p.title,text:p.thread,action:p.task,help:p.gate}}
function cardContext(c,i){const lens=THEME_LENS[S.theme];return [
 `把这张牌放回「${THEMES[S.theme][0]}」：最近哪一件具体小事，让你联想到「${c.keywords[0]}」？若想不到实例，不必认领这种状态。`,
 `就${lens.focus}而言，「${c.keywords[0]}」是你真正重视的需要，还是听起来理想的期待？请用自己的经历判断。`,
 `只在${lens.focus}里检查这个角度。你是否见过与「${c.keywords[0]}」相关的具体行为？没有观察依据，就保留为假设。`,
 `针对${lens.focus}，这张牌的建议里哪一项已经可用？尚未获得的人力、同意或时间，不算已经拥有的资源。`,
 `「${c.name}」提供行动灵感，而不发出行动命令。当前采用哪一步，还要服从你选择的现实条件、帮助方向与时间范围。`
 ][i];}
function positionReading(c,i){
 const contact=S.contact||0;
 if(contact===3)return `「${c.name}」在${POS[i][1]}，仅提供「${c.keywords[0]}」这一反思角度，不要求你解释、修复或重新联系。等你觉得安全且愿意时，可以问自己：${c.reflection}`;
 if(i===4&&contact!==1)return `本次不采用需要对方参与的通用行动读法。「${c.name}」的「${c.keywords[0]}」只留作自查：${c.reflection}行动以页首的个人整理为准，不发送、不推进联系。`;
 if(contact===2&&((c.name==='宝剑四'&&i===2)||(c.name==='宝剑骑士'&&i===2)||(c.name==='宝剑王后'&&i===2)))return `暂停联系是你明确选择的现实边界，不必为了对应「${c.name}」去解释或澄清。可以只在自己的记录中检查：${c.reflection}`;
 return c.positions[POS[i][0]];
}
function cardSection(c,i){return`<details class="result-detail" id="position-${i}"><summary>0${i+1} · ${POS[i][1]}<small>${esc(c.name)} · ${esc(c.keywords.slice(0,2).join(' / '))}</small></summary><section class="reading-section"><p class="section-label">象征视角 · 不等于已发生的事实</p><p class="context-reading">${esc(positionReading(c,i))}</p><p class="reflection">${esc(cardContext(c,i))}</p><details><summary>图像、牌义与参考来源</summary><p>${esc(c.image_cues)}</p><p>${esc(c.meaning)}</p><p class="small">上方是产品的现代牌位推演，不是原作者原句，也不是对现实的验证。外链仅在主动打开时联网。</p><div class="sources">${c.source_urls.filter(u=>/^https:\/\//.test(u)).map((u,j)=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">牌义参考 ${j+1} ↗</a>`).join('')}</div></details></section></details>`}
function resultPage(){const p=buildPlan();return`<div class="container"><div class="reading-top"><div><p class="eyebrow">YOUR NEXT SMALL STEP · V1.3</p><h1>不急着决定关系，<br>先找到自己的一步。</h1><p class="muted small">${S.mode==='demo'?'预设教学示例':'本次阅读'} · ${esc(new Date(S.created).toLocaleDateString('zh-CN'))} · 五张牌已固定</p></div><div class="stamp">先看现实<br>再看牌面</div></div>${demoBanner()}<div class="result-layout"><article class="reading-body"><div class="known-grid"><div><p class="section-label">你明确选择的</p><p>${esc(THEMES[S.theme][0])} · ${esc(HELPS[S.help][0])}<br>${esc(CONTACTS[p.contact][0])}<br>${esc(TIMES[S.time][0])}</p></div><div><p class="section-label">牌面不能替你确认的</p><p>对方的想法、是否愿意参与，以及关系会如何发展。下面的建议只供你结合事实取舍。</p></div></div>
<section class="next-step" id="your-step"><p class="step-label">这次只优先做一件事</p><h2>${esc(p.title)}</h2><p class="action-main">${esc(p.task)}</p><p class="plan-meta">${esc(p.contact===3?'先照顾当下，不安排沟通期限。':p.timing)}</p><details class="result-control"><summary>为什么是这一步？</summary><p style="margin-top:15px">${esc(p.why)}</p>${p.contact===3||p.fit===1?'':`<p>${esc(p.thread)}</p><p>${esc(p.support)}</p><p class="small muted">若牌义之间有不同方向，不取“多数票”；已知事实、你的边界和当前余力优先。</p>`}</details>
${p.contact===3?`<p class="script-line">${esc(p.script)}</p>`:`<details class="result-control"><summary>${S.help===1?'把需要写成一句话':'不知道怎么写？看一个留白句式'}</summary><p class="small muted" style="margin-top:14px">${esc(p.lens.example)}。按真实情况填写，不必逐字照用。</p><p class="script-line">${esc(p.script)}</p></details><p class="plan-meta">${esc(p.gate)}</p>${p.contact===1?`<details class="result-control"><summary>如果之后决定交流，可以怎样开场？</summary><p class="script-line" style="margin-top:14px">${esc(p.lens.request)}</p><p class="small muted">只邀请一次。对方没有接受，就回到自己的记录，不替对方设置回应期限。情绪升级或你感到不安时，暂停交流。</p></details>`:''}`}
<div class="step-check"><h3>做完后，只回看这两件事</h3><p class="small muted">${esc(p.contact===3?'等你觉得安全、愿意整理时再回看，不必现在完成。':p.review)}</p><p>1. 我实际做了什么？什么没有做？<br>2. ${p.contact===3?'什么让我更安全、更有选择？现在还需要哪些现实支持？':esc(p.lens.review)+'？下次保留、缩小，还是停止？'}</p><label for="personal-note" class="small muted">我的一句记录（可选）</label><textarea class="field note-field" id="personal-note" maxlength="300" placeholder="我做了____。我观察到____。下一步选择：保留 / 缩小 / 停止。"></textarea><p class="small muted" style="margin:10px 0 0">需要以后回看，可主动保存本机记录，并选择是否保留这段文字。</p></div></section>
<details class="result-control"><summary>建议不合适？调整现实条件，不重抽牌</summary>${choices(CONTACTS,p.contact,'contact')}<p class="small muted" style="margin-top:18px">解读不必都符合你。不贴合时，以自己的经验为起点。</p><div class="fit-buttons"><button class="btn ghost" data-choice="fit" data-value="0" aria-pressed="${p.fit===0}">保留牌面作参考</button><button class="btn ghost" data-choice="fit" data-value="1" aria-pressed="${p.fit===1}">暂不贴合，按现实整理</button></div></details>
<div class="reading-chapter"><span>02</span><div><p class="eyebrow">OPTIONAL · LOOK CLOSER</p><h2>想多理解一点，再展开。</h2></div></div><p class="muted small">五个位置不是五项任务。你无需全部采纳。</p><div class="result-spread" tabindex="0" role="group" aria-label="五张牌，手机可左右滑动查看">${p.cards.map((c,i)=>`<div><div class="mini-card"><span class="number">${SUITS[c.suit]} · ${displayNumber(c)}</span>${glyph(c)}<span class="name">${esc(c.name)}</span></div><div class="position">0${i+1} · ${POS[i][1]}<br>正位</div></div>`).join('')}</div>${p.cards.map(cardSection).join('')}</article>
<aside class="sidebar"><h3>留住这一步</h3><button class="btn primary" data-action="save">保存本机记录</button><details class="context-details"><summary>回看这次的问题 <span aria-hidden="true">＋</span></summary><dl class="context"><div><dt>关系主题</dt><dd data-bind="theme"></dd></div><div><dt>希望得到的帮助</dt><dd data-bind="help"></dd></div><div><dt>行动范围</dt><dd data-bind="time"></dd></div><div class="bg-context"><dt>我的原话 · 仅供回看</dt><dd data-bind="background"></dd></div></dl><p class="small muted">建议由选项与牌位整理；自由文字不参与解读。</p></details><button class="btn" data-action="share">导出五张牌分享卡 ↗</button><button class="btn" data-action="copy">复制简版牌阵</button><button class="btn ghost" data-action="restart">重新开始</button><p class="small muted" style="margin:17px 0 0">不用反复抽到满意的答案。先带着这一小步，回到自己的生活。</p></aside></div></div>`}

function methodPage(){return`<div class="container narrow method-content">${heading('HOW TO READ','有传统依据，也有清楚的边界。','这是一种象征性阅读工具。你可以借它整理经验，也可以不同意任何一段解读。')}<h2>我们如何抽牌</h2><p>采用 Rider–Waite–Smith 体系，22 张大阿卡那，权杖、圣杯、宝剑、星币各 14 张。力量编号 VIII、正义 XI。默认全部正位；首版不提供逆位、指示牌或澄清牌。</p><p>使用浏览器 crypto.getRandomValues 安全随机源，以拒绝采样生成无偏整数，再以 Fisher–Yates 洗牌。78 张唯一 ID 无放回选 5 张。主题、背景、点击速度和是否保存都不会改变牌组概率；动画只是呈现过程。</p><h2>五个位置的来历</h2><p>「当前关注状态／我重视的关系需要／值得检查的阻力／可以寻找的资源／下一步行动」是本产品原创的现代五牌阵，不是古代秘传牌阵。牌位在抽牌前固定。塔罗文献与当代流派之间存在差异，此处不宣称唯一读法。</p><h2>从牌义到处境</h2><p>v1.3 使用本地规则组合主题、希望的帮助、行动条件、时间范围与实际五张牌。自由背景文字不参与语义分析；它只在页面中原样显示。行动条件优先于任何牌义，冲突不安时不建议对质或推进联系。每张牌分为 RWS 图像线索、牌义参考、牌位下的现代情境推演，再给自查问题与微行动。原始牌义与产品推演分层展示；中文内容为原创改述。牌面使用产品原创的花色符号和编号组合，没有复刻 78 幅韦特原画。</p><p>高塔、死神等困难牌保留变化、损失、结束与动摇的张力，不预测死亡或灾难。宫廷牌可以提示品质与应对方式，无法据此识别某个人的身份或忠诚。</p><h2>这次阅读不能证明什么</h2><p>它不是科学量表，不给关系打分，不证明预测有效性，也不能确认读心、出轨、分手或复合。涉及健康、财务、法律或安全的实际问题，应使用现实信息与适当专业支持。没有付费化解，没有更准的付费牌组。</p><h2>内容留在哪里</h2><p>非敏感选项与已固定牌面会在当前浏览器标签页暂存，刷新可恢复。背景与随手记仅在页面内存中，刷新后清除。只有点击「保存本机记录」才会写入持久本机记录；你可选择是否包含背景和随手记，也可逐条或全部删除。私密浏览、file:// 策略与系统清理可能使本机存储失效，请留意反馈。</p><p>PNG 分享卡和复制摘要均默认不含背景与随手记，不会自动上传。浏览器下载是否最终保存，取决于浏览器设置。此版本没有服务器、账户、第三方分析、真实支付或 AI 调用。</p><h2>参考入口</h2><ol class="source-list"><li><a href="https://sacred-texts.com/tarot/pkt/" target="_blank" rel="noopener noreferrer">A. E. Waite · The Pictorial Key to the Tarot ↗</a></li><li><a href="https://www.vam.ac.uk/articles/tarot-cards" target="_blank" rel="noopener noreferrer">V&amp;A · A history of tarot cards ↗</a></li><li><a href="https://labyrinthos.co/blogs/tarot-card-meanings-list" target="_blank" rel="noopener noreferrer">Labyrinthos · 当代牌义参考 ↗</a></li></ol><div class="flow-actions"><button class="btn primary" data-go="home">回到体验首页 →</button><button class="text-btn" data-go="design">查看产品设计说明</button></div></div>`}
function designPage(){return`<div class="container">${heading('PRODUCT HANDOFF · V'+VERSION,'从体验到实现，一份可检查的交付。','本页随离线成品一起交付。当前版本为本地产品原型，没有公开部署。')}<div class="design-layout"><nav class="design-nav" aria-label="设计说明目录"><a href="#design" data-scroll="design-flow">01 页面与任务</a><a href="#design" data-scroll="design-visual">02 视觉规范</a><a href="#design" data-scroll="design-states">03 交互与状态</a><a href="#design" data-scroll="design-data">04 数据与随机</a><a href="#design" data-scroll="design-tests">05 验收用例</a><a href="#design" data-scroll="design-gap">06 上线差距</a><button class="btn ghost" data-go="home">进入体验 →</button></nav><article class="design-doc"><section id="design-flow"><h2>01 页面与核心任务</h2><p>帮助用户用五个象征视角整理一段关系。主要行动是写下问题、完成一次阅读、带走一项低风险尝试。无人格评分、无未来事件判定。</p><div class="flow-map"><span>品牌首页</span><span>→ 4 项问题引导</span><span>→ 确认问题与牌位</span><span>→ 洗牌 / 选 5 张</span><span>→ 自动展开</span><span>→ 完整阅读</span><span>→ 保存 / 分享 / 重开</span></div><table class="spec-table"><thead><tr><th>页面</th><th>主动作与信息层级</th></tr></thead><tbody><tr><td>首页</td><td>品牌主张 → 开始阅读 / 固定示例 → 简短边界 → 方法入口。</td></tr><tr><td>问题引导</td><td>关系主题、希望帮助、行动条件与可选 100 字背景、行动范围。可返回、清空、取消。</td></tr><tr><td>确认页</td><td>整理后的问题、输入记录、固定 5 牌位、78 牌与正位规则；抽牌后修改须明确开始新局。</td></tr><tr><td>抽牌 / 翻牌</td><td>五个固定槽位、无放回点选、分页牌背、进度；选五张后自动按牌位顺序展开。</td></tr><tr><td>结果</td><td>已知与未知 → 一项优先行动 → 条件、句式与回看 → 可展开的五段牌位推演。</td></tr><tr><td>记录 / 分享</td><td>保存本机记录需主动选择；PNG 有完整预览；复制摘要不包含自由文本；支持删除。</td></tr></tbody></table></section><section id="design-visual"><h2>02 视觉与排版规范</h2><div class="swatches"><div class="swatch"><i style="background:#101b2b"></i><span>深夜蓝 #101B2B</span></div><div class="swatch"><i style="background:#162437"></i><span>面板 #162437</span></div><div class="swatch"><i style="background:#f2eee4"></i><span>暖白 #F2EEE4</span></div><div class="swatch"><i style="background:#c4ac7a"></i><span>哑金 #C4AC7A</span></div></div><p style="margin-top:20px">标题采用系统宋体衬线序列，正文采用苹方 / 微软雅黑 / 系统无衬线；无远程字体依赖。主要容器最大 1160px、问题页最大 760px。桌面左右内边距 36px，手机 22px。8px 为基本节奏，常用 12 / 16 / 24 / 32px；面板圆角 12–20px，按钮圆角 7px。</p><table class="spec-table"><tr><th>层级</th><th>桌面 / 手机</th><th>行高</th></tr><tr><td>首页主标题</td><td>54 / 38px</td><td>1.5</td></tr><tr><td>页面标题</td><td>36 / 29px</td><td>1.4–1.5</td></tr><tr><td>牌位标题</td><td>23 / 21px</td><td>1.5</td></tr><tr><td>解读正文</td><td>16 / 15px</td><td>1.9</td></tr><tr><td>常规正文</td><td>15 / 14px</td><td>1.8</td></tr><tr><td>辅助文字</td><td>12 / 11px</td><td>1.7–1.8</td></tr></table><p>原创牌面由花色线条符号、牌名与唯一编号构成；大牌使用简洁几何符号，月亮与节制有专用符号。不是 78 幅独立叙事插画。轻微洗牌与翻牌动效可关闭，并尊重系统减少动画设置。所有动作使用原生按钮、可见焦点、中文可访问名称。</p></section><section id="design-states"><h2>03 核心状态、空态与错误态</h2><table class="spec-table"><thead><tr><th>状态</th><th>行为与反馈</th></tr></thead><tbody><tr><td>首次 / 记录为空</td><td>首页主动作开始阅读；本机记录为空时给出说明与返回入口。</td></tr><tr><td>进行中 / 刷新恢复</td><td>保存非敏感选项、牌序、已选 ID、已翻牌数。刷新不重抽；背景不自动暂存，并提示其恢复边界。</td></tr><tr><td>0–4 张 / 5 张</td><td>不足 5 张不能翻牌。满 5 张牌背全部禁用。洗牌仅在首张选中前可用。</td></tr><tr><td>浏览器返回</td><td>牌序、选牌与翻牌数保持。抽牌后回到确认页只能继续本局，修改问题需确认清除本局。</td></tr><tr><td>背景超长</td><td>按 Unicode 字符计数，超过 100 字给可读错误并禁用继续。</td></tr><tr><td>取消 / 重新开始</td><td>弹窗说明清除本次牌面与未保存自由文本；可取消。已保存记录不会因重开自动删除。</td></tr><tr><td>存储不可用 / 损坏</td><td>显示暂存或保存失败；不假称已保存。损坏暂存清除后引导重新开始。</td></tr><tr><td>剪贴板失败</td><td>打开已选中的纯文本区域，允许手动复制，并明确说明浏览器限制。</td></tr><tr><td>PNG 失败</td><td>显示生成失败与重新尝试提示；成功仅声称已发起下载，不冒充系统已落盘。</td></tr><tr><td>数据缺失 / 随机源缺失</td><td>数据不满 78 或校验失败时禁用随机入口，只开放明显标注的固定示例；安全随机源不可用时停止抽牌并解释。</td></tr></tbody></table></section><section id="design-data"><h2>04 数据结构与方法约定</h2><p>运行时完整性检查：${CARDS.length} 张；22 大牌与四花色各 14；每花色编号覆盖和唯一 ID；每张牌五位置、牌义、线索、自查、微行动和来源均须存在。当前：<strong>${AUDIT.ok?'78 张完整检查通过':'教学数据阶段，随机功能未开放'}</strong>。</p><pre class="code">{ id / card_id, name, suit, number,
  keywords: [], image_cues, meaning,
  positions: { state, need, obstacle, resource, action },
  reflection, micro_action, source_urls: [] }

reading = { version, mode, theme, help, time,
  deck: [78 unique ids], picks: [5 unique ids],
  revealed: 0..5, created, id }

mode = random | demo
背景和随手记仅内存；主动保存时可选择包含。</pre><p>随机通过 crypto.getRandomValues、拒绝采样、Fisher–Yates 完成，不使用随机比较器排序。牌位按选取顺序固定；正逆位不另算新卡。完整阅读由本地静态内容生成，无服务器、API、CDN、外部模型或支付依赖。自由文本使用 textContent 或表单 value 展示。</p></section><section id="design-tests"><h2>05 验收用例与证据</h2><p>具体实测结果见 ZIP 内 QA 报告。以下为验收标准，不表示每项已经在所有浏览器通过。</p><ol><li>核验 78 唯一 ID、正确分类和编号、所有内容字段非占位；固定五牌位。</li><li>完成四项引导、上一题、清空背景、确认、取消重开；输入 HTML 符号应原样显示且不可执行。</li><li>随机洗牌、选择五张不重复、选第六张被阻止；重复点击不得补抽。</li><li>刷新、浏览器返回、重新进入页面均恢复本局，不偷偷改变牌面。</li><li>预设示例固定五牌全正位，结果与导出始终标识教学演示。</li><li>自动展开、完整五段阅读、自查、行动、来源展开均可用。</li><li>本机保存、载入、单条删除、全部删除；取消弹窗不修改本局。</li><li>PNG 预览与下载、摘要复制与失败后手动复制；默认均无背景与随手记。</li><li>桌面与手机无横向溢出；键盘焦点清晰；减少动画有效。</li><li>单 HTML 在 file:// 离线打开，无网络请求才能完成流程。</li></ol></section><section id="design-gap"><h2>06 上线前的真实差距</h2><p>这是可以运行和评审的产品原型。以下尚未实现或尚需生产级工作：</p><ul><li>无服务器、账户、云端存储、同步、真实支付、订单或退款功能；当前没有模拟扣款页面。</li><li>未完成跨系统、跨浏览器、辅助技术和真实用户的全面可用性验证。当前环境的实际覆盖以 QA 报告为准。</li><li>本机存储非加密，受浏览器权限与清理策略影响；需在正式产品中做隐私、安全、保留政策与法律审查。</li><li>78 张中文改述与情境解读仍需内容专家审校、困难牌和极端组合审查，以及引用与资产权利复核。</li><li>当前为规则式本地解读，不理解自由文本全部语义。牌间总结按关键词组织，尚非真人逐局解读。</li><li>上线需要域名、托管、HTTPS、发布与回滚、监控、版本迁移策略；本次没有公开部署。</li></ul><button class="btn primary" data-go="home">进入完整体验 →</button></section></article></div></div>`}
function bindContext(){for(const el of $$('[data-bind]')){const key=el.dataset.bind;el.textContent=key==='question'?question():key==='theme'?THEMES[S.theme][0]:key==='help'?HELPS[S.help][0]:key==='time'?TIMES[S.time][0]:S.background||'未填写 / 未保存'}}
function render(){cancelAutoReveal();let r=route(),safe=navigationGuard(r);if(safe!==r){history.replaceState(null,'','#'+safe);r=safe}if(r!==lastRenderedRoute){cancelShuffle();lastRenderedRoute=r}document.body.dataset.scene=r.startsWith('question/')?'question':r;const q=/^question\/([0-3])$/.exec(r);const html=r==='home'?home():q?wizard(+q[1]):r==='confirm'?confirmPage():r==='draw'?drawPage():r==='reveal'?revealPage():r==='result'?resultPage():r==='method'?methodPage():r==='design'?designPage():home();$('#content').innerHTML=html;$('#content').classList.remove('fade-in');void $('#content').offsetWidth;$('#content').classList.add('fade-in');bindContext();if($('#background')){$('#background').value=S.background;updateBackground()}if($('#personal-note'))$('#personal-note').value=S.note;updateDot();lastPickId='';window.scrollTo(0,0);$('#content').focus({preventScroll:true});if(storageNotice&&!noticeShown){noticeShown=true;toast(storageNotice)}if(r==='reveal')startAutoReveal()}
function updateBackground(){const n=Array.from($('#background').value).length;$('#char-count').textContent=n+' / 100';$('#background-error').classList.toggle('hidden',n<=100);$('#wizard-next').disabled=n>100}
function uniformInt(max){if(!globalThis.crypto?.getRandomValues)throw Error('当前浏览器没有安全随机源。请使用较新的浏览器打开此文件。');const range=4294967296,limit=range-range%max,v=new Uint32Array(1);do{crypto.getRandomValues(v)}while(v[0]>=limit);return v[0]%max}
function shuffled(ids){const a=ids.slice();for(let i=a.length-1;i>0;i--){const j=uniformInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function motionReduced(){return reduce||matchMedia('(prefers-reduced-motion:reduce)').matches}
function cancelShuffle(){if(shuffleTimer!==null)clearTimeout(shuffleTimer);shuffleTimer=null;shuffleBusy=false}
function cancelAutoReveal(){revealEpoch++;for(const timer of autoTimers)clearTimeout(timer);autoTimers.clear()}
function autoLater(callback,delay,epoch,id){const timer=setTimeout(()=>{autoTimers.delete(timer);if(revealEpoch!==epoch||S.id!==id||route()!=='reveal'||S.picks.length!==5||$('#modal').open)return;callback()},delay);autoTimers.add(timer)}
function updateAutoCard(i){const card=byId.get(S.picks[i]),el=$(`[data-auto-card="${i}"]`);if(el){el.classList.add('revealed');el.setAttribute('aria-label',card.name+'正位');el.closest('.reveal-wrap').querySelector('.caption').textContent=card.keywords.slice(0,2).join(' · ')}if($('#reveal-count'))$('#reveal-count').textContent=`已展开 ${S.revealed} / 5 张 · 全正位`}
function finishAutoReveal(){if(route()!=='reveal'||S.picks.length!==5)return;cancelAutoReveal();S.revealed=5;S.stage='result';persist();if(route()!=='result'){history.replaceState(null,'','#result');render()}}
function startAutoReveal(){cancelAutoReveal();if(route()!=='reveal'||S.picks.length!==5||$('#modal').open)return;if(motionReduced()||S.revealed===5){finishAutoReveal();return}S.stage='reveal';persist();const epoch=revealEpoch,id=S.id;const step=()=>{if(S.revealed>=5)return;const i=S.revealed;S.revealed++;persist();updateAutoCard(i);if(S.revealed===5){window.dispatchEvent(new CustomEvent('tarot:reveal-complete',{detail:{id,mode:S.mode}}));autoLater(finishAutoReveal,1000,epoch,id)}else autoLater(step,420,epoch,id)};autoLater(step,180,epoch,id)}

function startDraw(){if(S.deck.length){resume();return}if(!AUDIT.ok){toast('完整牌库尚未通过校验，请先体验教学示例。');return}try{const deck=shuffled(CARDS.map(c=>c.card_id));S.deck=deck;S.mode='random';S.stage='draw';S.created=new Date().toISOString();S.id='R-'+Date.now().toString(36)+'-'+deck.slice(0,2).join('-');persist();go('draw')}catch(e){toast(e.message)}}
function resume(){go(S.revealed===5?'result':S.picks.length===5?'reveal':'draw')}
function showModal(html){cancelAutoReveal();returnFocus=document.activeElement;$('#modal-content').innerHTML='<button class="modal-close" data-action="close" aria-label="关闭弹窗">×</button>'+html;$('#modal').showModal();$('#modal').scrollTop=0}
function close(resumeReveal=true){if($('#modal').open)$('#modal').close();returnFocus?.focus?.();if(resumeReveal&&route()==='reveal')startAutoReveal()}
function resetPrompt(kind='restart',target='question/0'){showModal(`<p class="eyebrow">A NEW CHAPTER</p><h2>${kind==='cancel'?'取消这次阅读？':kind==='demo'?'打开预设教学示例？':'开始新的一次阅读？'}</h2><p>将清除本次牌面、未保存的背景与随手记。主动保存的本机记录仍会保留。</p><div class="modal-actions"><button class="btn ghost" data-action="close">保留本次</button><button class="btn primary" data-reset="${kind}" data-target="${target}">${kind==='cancel'?'确认取消':kind==='demo'?'打开示例':'确认重新开始'}</button></div>`)}
function doReset(kind,target){cancelAutoReveal();cancelShuffle();close(false);S=fresh();removeStore('sessionStorage',KEY);if(kind==='demo')demoStart();else{S.stage=target==='home'?'home':'question';persist();go(target)}}
function demoStart(){cancelAutoReveal();cancelShuffle();if(DEMO.length!==5){toast('教学示例资料不可用。');return}S={...fresh(),mode:'demo',stage:'reveal',deck:DEMO.slice(),picks:DEMO.slice(),created:new Date().toISOString(),id:'D-'+Date.now().toString(36)};persist();go('reveal')}
function savePrompt(){showModal(`<p class="eyebrow">ON THIS DEVICE ONLY</p><h2>为这次阅读留个位置。</h2><p>保存在当前浏览器中，不会上传。最多保留 20 条；可随时在「本机记录」中删除。</p><label class="check-row"><input type="checkbox" id="save-private"><span>同时包含背景与随手记（仅本机；默认不勾选）</span></label><div class="modal-actions"><button class="btn ghost" data-action="close">取消</button><button class="btn primary" data-action="save-confirm">保存本机记录</button></div>`)}
function saveConfirm(){const include=$('#save-private').checked,entry={...S,background:include?S.background:'',note:include?S.note:''};let all=savedReadings().filter(x=>x.id!==S.id);all.unshift(entry);if(storeSet('localStorage',SAVE_KEY,JSON.stringify(all.slice(0,20)))){close();updateDot();toast(include?'已保存到本机，包含你选择保留的背景与随手记。':'已保存牌面与选项；未保存背景与随手记。')}else toast('保存失败：浏览器不允许本机存储或空间不足。可以导出分享卡或复制摘要。')}

async function downloadShare(){if(shareBusy)return;shareBusy=true;const btn=$('[data-action="download"]');if(btn){btn.disabled=true;btn.textContent='正在生成…'}try{const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=1500;const c=canvas.getContext('2d');if(!c)throw Error('canvas');await drawCosmosOnCanvas(c);c.strokeStyle='#c4ac7a';c.lineWidth=2;roundRect(c,45,45,1110,1410,12);c.lineWidth=.7;c.globalAlpha=.5;roundRect(c,58,58,1084,1384,9);c.globalAlpha=1;c.lineWidth=2;c.beginPath();c.moveTo(585,91);c.lineTo(615,91);c.moveTo(600,76);c.lineTo(600,106);c.stroke();c.globalAlpha=.3;c.beginPath();c.arc(600,430,285,0,Math.PI*2);c.stroke();c.globalAlpha=1;c.textAlign='center';c.fillStyle='#c4ac7a';c.font='24px "Microsoft YaHei",sans-serif';c.fillText(S.mode==='demo'?'预设教学示例 · 非随机抽牌':'THE NEXT CHAPTER',600,140);c.fillStyle='#f2eee4';c.font='64px SimSun,serif';c.fillText('关系的下一步',600,255);c.fillStyle='#c4ac7a';c.font='26px "Microsoft YaHei",sans-serif';c.fillText('五张牌，五个看见自己的视角',600,315);for(let i=0;i<5;i++){const card=byId.get(S.picks[i]),x=100+i*205,y=430;const ivory=c.createLinearGradient(x,y,x+180,y+320);ivory.addColorStop(0,'#faf7ee');ivory.addColorStop(1,'#e9e2d2');c.fillStyle=ivory;c.shadowColor='#00000044';c.shadowBlur=22;c.shadowOffsetY=12;c.beginPath();c.roundRect(x,y,180,320,10);c.fill();c.shadowBlur=0;c.shadowOffsetY=0;c.strokeStyle='#ab9468';c.lineWidth=1;roundRect(c,x+9,y+9,162,302,5);c.fillStyle='#615137';c.font='18px "Microsoft YaHei",sans-serif';c.fillText(`${pad(i+1)} / ${displayNumber(card)}`,x+90,y+48);const symbol=await svgForExport(card);c.drawImage(symbol,x+30,y+62,120,153);c.font='29px SimSun,serif';c.fillText(card.name,x+90,y+245);c.font='17px "Microsoft YaHei",sans-serif';c.fillText('正位',x+90,y+284);c.fillStyle='#c4ac7a';c.font='18px "Microsoft YaHei",sans-serif';wrapText(c,POS[i][1],x+90,800,180,29)}const sum=summary();c.fillStyle='#f2eee4';c.font='38px SimSun,serif';wrapText(c,'五个视角，不替你作决定。',600,925,960,63);c.fillStyle='#acb8c5 t.action){case'begin':if(S.deck.length)resume();else go('question/'+S.questionStep);break;case'demo':if(S.deck.length||S.background||S.note)resetPrompt('demo');else demoStart();break;case'next':if($('#background')&&Array.from(S.background).length>100)return;go(+b.dataset.step===3?'confirm':'question/'+(+b.dataset.step+1));break;case'previous':go(+b.dataset.step===0?'home':'question/'+(+b.dataset.step-1));break;case'clear-background':S.background='';$('#background').value='';updateBackground();toast('背景已清空。');break;case'cancel':resetPrompt('cancel','home');break;case'restart':resetPrompt();break;case'start-draw':startDraw();break;case'resume':resume();break;case'skip-reveal':finishAutoReveal();break;case'shuffle':if(S.picks.length||shuffleBusy)return;try{S.deck=shuffled(S.deck);persist();shuffleBusy=true;$('.deck-grid').classList.add('shuffling');b.disabled=true;const shuffleId=S.id;shuffleTimer=setTimeout(()=>{shuffleTimer=null;shuffleBusy=false;if(route()==='draw'&&S.id===shuffleId)render()},750);toast('已重新洗牌，尚未选取任何牌。')}catch(err){toast(err.message)}break;case'close':close();break;case'save':savePrompt();break;case'save-confirm':saveConfirm();break;case'records':if($('#modal').open)close();recordsModal();break;case'records-return':close();recordsModal();break;case'delete-all':showModal('<h2>删除全部本机记录？</h2><p>所有主动保存的阅读将被永久删除。当前页面中的本局阅读仍保留。</p><div class="modal-actions"><button class="btn ghost" data-action="records-return">取消</button><button class="btn danger" data-action="delete-all-confirm">确认全部删除</button></div>');break;case'delete-all-confirm':if(removeStore('localStorage',SAVE_KEY)){close();recordsModal();updateDot();toast('已删除全部本机记录。')}else toast('删除失败：浏览器存储不可用。');break;case'share':sharePrompt();break;case'copy':await copySummary();break;case'download':await downloadShare();break}});
