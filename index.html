<script id="cards-data" type="application/json">[{"id":"major_00","name":"愚人","suit":"major","number":0,"keywords":["开启","好奇","未知"],"image_cues":"年轻旅人持白花停在崖边，肩背小包，白犬跃起，远山映着晴空。","meaning":"愚人的传统意象指向初始、自由与尚未定形的可能，也包含经验不足的代价。这里借它观察探索的心态，不把冒险解释为必有好结果。","positions":{"state":"你可以留意自己是否渴望给关系一个新起点，或暂时不想被既有标签定义；新鲜感与对现实的认识可以同时存在。","need":"这张牌邀请你辨认探索空间的重要性：你是否希望能自在表达好奇、尝试不同相处方式，而不被立刻要求保证结果。","obstacle":"值得检查的不是勇气够不够，而是有没有把未知当成无需准备；关系中的边界、双方意愿和现实成本仍需看清。","resource":"资源可以来自初学者的开放、轻松的共同体验，以及愿意提醒你看路的人；接纳提醒，并不会取消你的自主选择。","action":"选一个可撤回的小尝试，例如提出一次轻松交流；先说明你的意图，也留出对方拒绝的空间，再观察自己的感受。"},"reflection":"我想尝试的是新体验，还是逃开一个尚未处理的问题？","micro_action":"写下一个小尝试，并为它设定时间或精力上限。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/zero-the-fool","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-fool-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_01","name":"魔术师","suit":"major","number":1,"keywords":["主动","技能","落实"],"image_cues":"人物一手举杖一手指地，头顶无限符号，桌上陈列四种花色器物。","meaning":"魔术师的传统意象连接意愿、表达与运用现有工具，强调把想法落实为行动。它不是心想事成的保证，也不代表能操控别人的回应。","positions":{"state":"把目光放在你已经能做的部分：表达、倾听、安排时间或履行承诺；关系的进展并不完全在你的掌控之内。","need":"你可能重视有回应的沟通与能够发挥主动性的空间；可以检查自己是否既能提出需要，也能被允许保有自己的能力。","obstacle":"若总想找到一句完美的话改变局面，可能忽略了行动的一致性；也要分清真诚表达与试图设计对方反应之间的界线。","resource":"盘点你已有的沟通经验、实际时间和可信支持；不必等待变成理想的自己，先用现成的一项能力帮助关系变得具体。","action":"把一个笼统期待改成可以讨论的请求，例如约定交流时长；明确你愿意做什么，不替对方承诺，也不把请求变成测试。"},"reflection":"我能主动完成哪一部分，而不是等待对方先改变？","micro_action":"把“希望被重视”改写成一个具体、可拒绝的请求。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/i-the-magician","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-magician-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_02","name":"女祭司","suit":"major","number":2,"keywords":["倾听","内在","留白"],"image_cues":"静坐者手持半遮的卷轴，位于黑白双柱之间，脚边新月映着帷幕。","meaning":"女祭司的传统意象涉及内在感知、尚未揭示的知识与静默。它适合提醒人留意感受和信息空白，但直觉不能证明他人的秘密或意图。","positions":{"state":"你可以暂时不急于给关系下结论，先听见自己的迟疑、期待与不适；辨认感受是真实的，不等于猜测已经得到证实。","need":"留白、隐私与被耐心倾听可能是值得辨认的需要；你不必为了维持亲近，就在尚未准备好时交出所有内心细节。","obstacle":"沉默可能帮助理解，也可能成为回避核实的方式；检查自己是否把没有说出口的期待，误当成对方理应知道的事。","resource":"安静的独处、简短记录和不催促你表态的人，都可以支持内在整理；把感受与已知事实分开记，会让倾听更扎实。","action":"先记录身体感受、情绪和待确认的问题，再决定是否询问；只谈自己观察到的情况，不以直觉为他人定罪或贴标签。"},"reflection":"我现在知道什么，又有哪些只是我的猜测？","micro_action":"用两栏分别写下“已知事实”和“我的感受”。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/ii-the-high-priestess","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-high-priestess-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_03","name":"皇后","suit":"major","number":3,"keywords":["滋养","感官","生长"],"image_cues":"戴星冠的人坐在软垫上，麦田、流水与树林环绕，身旁有金星纹盾。","meaning":"皇后的传统意象关乎丰盛、照料、感官体验与创造的生长。此处不把生育象征当成怀孕判断，也不把照顾责任限定给某种性别。","positions":{"state":"留意你在关系中如何照顾和接受照顾，以及身体是否已经疲倦；亲密不只靠谈论，也体现在日常生活是否有滋养。","need":"温柔回应、舒适相处和不必靠表现换取关爱，可能值得放进你的需要清单；你同样有资格被照顾，而非只负责给予。","obstacle":"当照料变成包办，或付出被当作换取亲近的条件，滋养也会令人窒息；检查你的好意是否尊重彼此的自主与容量。","resource":"稳定的生活节奏、自然环境、创造活动和现有的关怀经验，都是可寻找的资源；先恢复自己的余力，再决定给多少。","action":"挑一种双方舒服的日常关怀，先询问是否需要；同时给自己安排一件补充精力的小事，让照顾不再只流向一个方向。"},"reflection":"我提供的照顾，是对方需要的，也是我负担得起的吗？","micro_action":"今天为自己留出十分钟，做一件舒适且不额外花钱的事。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/iii-the-empress","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-empress-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_04","name":"皇帝","suit":"major","number":4,"keywords":["边界","结构","责任"],"image_cues":"披红袍的统治者端坐石椅，扶手刻着羊头，手持权杖与圆球。","meaning":"皇帝的传统意象强调结构、责任、秩序与实际治理，也带出权力如何使用的问题。稳定不等于控制，更不能凭此判断谁应当支配关系。","positions":{"state":"你可以看看自己正在承担哪些安排与责任，又有哪些边界仍不清楚；当关系依赖一人维持秩序时，稳定也可能很累。","need":"可预期的约定、可靠的履行与清楚的个人界线，可能比热烈表达更重要；辨认哪些规则保护你，哪些只是让你紧绷。","obstacle":"若安全感必须靠掌握全部信息或决定来维持，结构可能滑向控制；也要检查自己是否用“负责”替代了询问与协商。","resource":"清楚的日程、可执行的分工和你已有的自我管理能力，可以提供支撑；有效规则应当让双方更有空间，而不是更受限。","action":"选一个反复摩擦的日常议题，提出具体边界或分工供讨论；写清你能承担的部分，不单方面规定对方必须怎样生活。"},"reflection":"我想建立的规则保护了谁，又限制了谁？","micro_action":"写下一条以“我可以／我不能”表达的个人边界。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/iv-the-emperor","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-emperor-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_05","name":"教皇","suit":"major","number":5,"keywords":["传统","共同价值","学习"],"image_cues":"戴三重冠的人在双柱间举手示意，脚下交叉双钥匙，两名求教者在前。","meaning":"教皇的传统意象关联制度、传承、教导与共同信念，常被用于讨论关系承诺。这里不把既有规范等同于唯一正确的生活方式。","positions":{"state":"关系中的家庭观念、惯例或身份期待，可能值得梳理；你可以辨认自己真心认同的部分，以及只是习惯遵循的部分。","need":"共同语言、可说明的承诺与被群体接纳，可能是你重视的需要；同时留意，归属感是否容得下你真实而不同的选择。","obstacle":"“大家都这样”可能遮住实际需要，权威意见也未必适合每段关系；检查你是否为了合乎标准而忽略了自己的感受。","resource":"可借鉴成熟的沟通方法、可信的教导或经过检验的约定；把它们当可讨论的参考，而不是要求自己服从的最后答案。","action":"列出一项继承来的关系观念，追问它为何重要；决定保留、调整还是暂不采用，再用自己的语言说明它的实际意义。"},"reflection":"这条关系规则是我选择的，还是我从未想过可以选择？","micro_action":"写下一条熟悉的关系观念，并补上一句自己的理由。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/v-the-hierophant","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-hierophant-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_06","name":"恋人","suit":"major","number":6,"keywords":["联结","选择","一致"],"image_cues":"两个人在天使与太阳之下坦然站立，身后分别有树木，远处山峰相隔。","meaning":"恋人的传统意象关乎吸引、联结、价值的一致与选择。它并非命定伴侣的证明，也不保证互爱；有意义的选择仍需知情、同意与承担。","positions":{"state":"你可以关注自己想靠近什么，也想保留什么；吸引与长期相处是否相容，需要从实际互动理解，而不是只凭强烈感受。","need":"被真实看见、能够自愿选择和共享重要价值，可能是亲密中不可缺少的部分；靠近不必以抹去自己的差异为代价。","obstacle":"为了维持和谐而跳过分歧，可能使选择表面一致；检查自己有没有清楚表达底线，也有没有给彼此说“不”的余地。","resource":"真诚的对话、已有的互相尊重和你对自身价值的认识，都能支持选择；即使结论不同，清楚也比勉强的一致更有用。","action":"选一个与你有关的重要价值，用具体例子说明它如何影响相处；邀请讨论而非索要保证，让选择建立在可见的信息上。"},"reflection":"为了靠近这段关系，我是否正在放弃一个重要的自己？","micro_action":"写下三项关系价值，并圈出一项不可轻易妥协的。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/vi-the-lovers","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-lovers-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_07","name":"战车","suit":"major","number":7,"keywords":["方向","协调","意志"],"image_cues":"披甲人物站在星幕战车内，前方黑白双狮身兽并列，城墙位于身后。","meaning":"战车的传统意象涉及意志、方向与驾驭相反力量，强调有组织地前行。关系不是胜负赛局，行动力也不能替代彼此对方向的同意。","positions":{"state":"你可能正在努力推动进展，或协调靠近与退后两股愿望；先看清自己的方向，再分辨哪些进度是你真的想要的。","need":"明确的方向、共同讨论节奏和保有自主行动能力，可能是你重视的需要；进展未必越快越好，也可以包含必要的停顿。","obstacle":"当“必须有结果”压过了实际交流，推进会变成拉扯；检查你是否在独自拉动关系，或把不同步误认为输给了谁。","resource":"清楚的优先顺序、可分解的目标与调节节奏的能力，可以帮助你前行；把力气用在可控行动，而非追赶别人的反应。","action":"为自己设定一个小目标和停止条件，例如只提出一次明确邀请；尊重回应，再决定下一步，不用连续加码证明诚意。"},"reflection":"我在追求共同的方向，还是只想尽快消除不确定？","micro_action":"写下一个本周能完成的沟通目标，以及何时暂停推进。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/vii-the-chariot","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-chariot-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_08","name":"力量","suit":"major","number":8,"keywords":["勇气","柔韧","节制"],"image_cues":"白衣人物温柔扶住狮子的嘴，花环相连，头顶悬着横置的无限符号。","meaning":"力量的传统意象把勇气与温和、自我约束和耐心相连，而非靠压制获胜。它不要求无限忍耐，更不把承受伤害当作爱的能力。","positions":{"state":"留意你面对强烈情绪时怎样回应：急着压下、立即反击，还是给自己一点缓冲；有情绪与能作出选择可以同时成立。","need":"能表达不满而不被羞辱、能柔软也能坚定，可能是你重视的相处条件；温柔不应只由你提供，也需要有真实的界线。","obstacle":"若把坚强理解成永不生气或永不求助，你可能正在过度消耗；检查自己是否为了表现宽容，跳过了应被认真处理的问题。","resource":"你曾经停下来再回应的经验、能让身体放松的习惯和可信支持，都是力量来源；需要帮助时，求助不等于失败。","action":"先让情绪强度降低一点，再表达一个清楚的需要；可以温和但不含糊，若交流已不安全，就优先离开现场并寻求支持。"},"reflection":"我正在练习耐心，还是在要求自己无底线地忍受？","micro_action":"回复前先停一分钟，写出一句不攻击人的真实感受。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/viii-strength-or-fortitude","https://labyrinthos.co/blogs/tarot-card-meanings-list/strength-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_09","name":"隐者","suit":"major","number":9,"keywords":["独处","省察","指引"],"image_cues":"披灰袍的长者站在高处，一手拄杖，一手提起装着六角星的灯笼。","meaning":"隐者的传统意象涉及独处、省察与灯火般的指引，强调从喧闹中辨认方向。它不代表注定孤独，也不要求切断与可信支持的联结。","positions":{"state":"你可以为自己留一段不被催促的时间，辨认关系之外的声音和价值；暂时独处，是整理需要，不必解释成感情的结论。","need":"自主思考、适量的私人空间和有深度的理解，可能比持续联系更重要；你可以需要安静，同时仍然珍惜与人的联结。","obstacle":"反思若只在脑中绕圈，可能变成与外界隔绝；检查你是否一直等待想得完全明白，才允许自己求助或表达一个小问题。","resource":"过往经验、独处时的记录和不替你作决定的前辈，都能像灯一样提供局部照明；不必要求某个人给出全部答案。","action":"安排一段有起止时间的独处，写下最重要的一个发现；需要暂停交流时说明预计何时回来，避免用失联代替表达界线。"},"reflection":"独处之后，我更能理解自己，还是更难回到现实交流？","micro_action":"留十分钟不看消息，只写下此刻最想被理解的一件事。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/ix-the-hermit","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-hermit-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_10","name":"命运之轮","suit":"major","number":10,"keywords":["变化","周期","适应"],"image_cues":"巨大圆轮悬在云间，轮侧有上下运动的形象，四角有持书的有翼生灵。","meaning":"命运之轮的传统意象关乎周期、转折与人无法全盘掌控的变化。这里不把它解释为好运将至或宿命安排，而是提醒区分条件与选择。","positions":{"state":"你可以观察相处节奏是否随工作、距离或生活阶段变化；先识别现实条件的移动，不急着把每次起伏都归因于个人价值。","need":"面对变化时仍可商量、保有弹性并获得基本稳定，可能是你重视的需要；接受不确定，不等于只能被动等事情发生。","obstacle":"把一切交给缘分，或执意让关系永远停在某一阶段，都可能缩小选择；检查有哪些可调整的小事被“没办法”盖住了。","resource":"过去适应变化的经验、可替代的安排和支持网络，可以缓冲波动；资源不一定是改变大环境，也可能是增加一条可走的路。","action":"将当前困扰分成可影响与暂不可控两类；只为前者选一个小调整，同时为后者预留弹性，不依据抽牌押注关系结果。"},"reflection":"我能改变的部分是什么，又在哪些地方过度责怪自己？","micro_action":"写下一个可调整事项和一个暂时无法控制的条件。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/x-wheel-of-fortune","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-wheel-of-fortune-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_11","name":"正义","suit":"major","number":11,"keywords":["公平","事实","承担"],"image_cues":"戴冠者坐在双柱之间，一手举直剑，一手持天平，红袍下露出白鞋。","meaning":"正义的传统意象强调事实、公平、判断与行动的后果。它不是对谁有罪的裁决，也不代表遭遇伤害是应得的报偿；责任应依据实际行为辨认。","positions":{"state":"你可以关注付出、约定和决定是否清楚而对等；先把具体事件摆出来，再看自己的感受，不必急着替整段关系判输赢。","need":"透明、可核实的承诺与被公平对待，可能是你重视的需要；公平不总是每件事一人一半，但分配应能被讨论和同意。","obstacle":"若只搜集支持自己结论的细节，判断可能变窄；也要留意是否把别人的行为责任背到自己身上，或用记账取代沟通。","resource":"明确记录、双方曾同意的规则与能够区分事实和评价的能力，都是资源；必要时请可信第三方帮助整理，而非替你宣判。","action":"挑一个具体失衡点，说明发生了什么、对你有什么影响及希望如何调整；承担自己的部分，但不要替他人的选择负责。"},"reflection":"我所说的不公平，具体发生在哪个行为或约定上？","micro_action":"把一件冲突写成不含“总是、从不”的事实描述。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/xi-justice","https://labyrinthos.co/blogs/tarot-card-meanings-list/justice-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_12","name":"倒吊人","suit":"major","number":12,"keywords":["暂停","换位","取舍"],"image_cues":"人物单脚倒悬于有叶的木架，另一腿交叉，神情平静，头边有光环。","meaning":"倒吊人的传统意象涉及暂停、视角转换与有意识的取舍，也保留等待和放下的代价。它不要求受苦换来爱情，更不说明牺牲必有回报。","positions":{"state":"你可以看看自己是否处于暂时无法推进的阶段；与其继续用同一方法用力，不妨观察停下来后才看得见的需要与限制。","need":"不被催着定论、获得重新理解局面的空间，可能是重要需要；有价值的暂停应有边界，不必变成无限期压下自己的愿望。","obstacle":"如果长期等待没有新的信息或约定，暂停可能只是拖延；检查你付出的时间与精力，是否仍是知情、自愿且可以改变的。","resource":"转换问题的角度、允许暂不行动，以及愿意提供不同看法的人，都可能帮助你；理解另一种角度，不等于替任何伤害开脱。","action":"给暂停设定一个复盘时间，列出届时需要知道的事实；在此之前照常安排自己的生活，不把全部注意力悬在一个回应上。"},"reflection":"我还在等待新的信息，还是只害怕承认等待已有成本？","micro_action":"为一件悬而未决的小事设定复盘日期，并写下所需信息。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/xii-the-hanged-man","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-hanged-man-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_13","name":"死神","suit":"major","number":13,"keywords":["结束","转化","告别"],"image_cues":"披甲骷髅骑白马举黑旗，不同身份的人面对它，远处双塔之间升起光亮。","meaning":"死神的传统意象讨论结束、不可维持的旧形式与转化，包含真实的失落和告别。它不预言死亡、灾病或分手，也不保证结束后马上变好。","positions":{"state":"可以观察有哪些旧习惯、期待或相处方式已不再合适；承认变化可能带来难过，不必立刻把失落包装成值得感恩的成长。","need":"允许告别、让变化被认真承认，以及不被迫维持旧角色，可能是你重视的需要；你可以怀念过去，同时重新安排自己的现在。","obstacle":"因已投入很多而继续维持无效模式，可能让代价增加；检查你舍不得的是实际关系、过去的愿景，还是曾经投入的自己。","resource":"辨认已经改变的事实、允许哀伤的支持关系和简单的告别仪式，可以提供资源；转化不必靠立刻开启另一段关系来证明。","action":"先停止一个小而明确的旧模式，例如重复翻看让自己难受的记录；重大关系决定仍需事实、时间与现实支持，不由牌决定。"},"reflection":"这张牌让我想到哪些已经变化的期待？如果没有，也可以不作对应。","micro_action":"写下一种想停止的消耗习惯，今天先暂停一次。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/xiii-death","https://labyrinthos.co/blogs/tarot-card-meanings-list/death-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_14","name":"节制","suit":"major","number":14,"keywords":["调和","分寸","耐心"],"image_cues":"有翼人物一脚在岸一脚入水，将液体在双杯间倾注，远方小路通向光。","meaning":"节制的传统意象关注调和、比例、耐心与不同部分的协作。它不是凡事折中的命令；真正的协调仍需保留界线，并承认磨合需要时间。","positions":{"state":"你可以观察联系、独处、表达与休息之间的比例是否合适；关系的调整可能更像缓慢校准，而不是一次谈话解决所有问题。","need":"适宜的节奏、可持续的投入和能够协商差异，可能比戏剧性的承诺更重要；你可以希望靠近，也可以需要恢复自己的余力。","obstacle":"为了不冲突而把一切折中，可能掩盖不能妥协的界线；检查所谓平衡是否只靠你减少需要，或要求自己永远平静。","resource":"你已有的调整经验、可重复的小约定和能兼顾双方现实的方案，都是资源；保留有效的部分，再一次只改动一个变量。","action":"选择一项容易反复的节奏问题，提出一个短期试行方案；约好之后再复盘，而不是把第一次尝试当成永久不变的标准。"},"reflection":"现在最需要调整的是份量、节奏，还是一条不能让步的边界？","micro_action":"为联系与独处各留一个小时间段，观察是否更舒服。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/xiv-temperance","https://labyrinthos.co/blogs/tarot-card-meanings-list/temperance-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_15","name":"恶魔","suit":"major","number":15,"keywords":["束缚","欲望","代价"],"image_cues":"有角的身影立于台座，倒举火炬；下方两人颈系锁链，链环留有空间。","meaning":"恶魔的传统意象涉及欲望、依附、权力与束缚，提醒看见即时满足背后的成本。它不证明任何人邪恶、出轨或成瘾，也不把受困归咎于意志薄弱。","positions":{"state":"你可以检查是否有明知消耗却反复进行的互动，例如不断求证或讨好；先描述模式与影响，不急着给自己或他人贴标签。","need":"既能承认欲望、又保有拒绝和离开选择的关系，可能是你重视的需要；强烈吸引不能代替安全、同意与实际的自由。","obstacle":"害怕失去、短暂安慰或投入成本，可能让某个模式难以松动；也需辨认真实的外部限制，不把受控制说成自己不够努力。","resource":"可信的旁观支持、现实边界与可获得的专业资源，都能帮助增加选择；若存在威胁或控制，优先考虑安全，不独自硬碰硬。","action":"选一个不增加风险的小边界，先减少一次自动反应；若你担心表达边界会招致伤害，先联系可信支持，而不是直接对质。"},"reflection":"这个模式给我什么短暂满足，又让我承担了什么代价？","micro_action":"记录一次冲动出现的时间、诱因，以及实际付出的成本。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/xv-the-devil","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-devil-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_16","name":"高塔","suit":"major","number":16,"keywords":["动摇","揭示","重建"],"image_cues":"闪电击中高塔，冠顶掀开，火光从窗中涌出，两个人影从塔旁坠落。","meaning":"高塔的传统意象表现结构动摇、突发揭示与旧有认知的破裂。画面不是灾祸预告；它可用来反思不再可靠的假设，同时承认震动与恢复的成本。","positions":{"state":"如果最近有事实打破你的原有理解，可以先辨认冲击落在哪里；若并无这种经历，也不必为了对应牌面而寻找危机。","need":"在变化或冲突中获得安全、清楚的信息和缓冲时间，可能比立即得出结论更重要；你不需要马上解释一切或修好一切。","obstacle":"为了保住原来的解释而忽略事实，可能增加混乱；另一端则是把一个冲突扩大为全盘崩塌，两种倾向都值得温和检查。","resource":"可靠的信息、熟悉的生活锚点与能够实际帮忙的人，是重建时可寻找的资源；先保住基本稳定，再讨论更大的关系安排。","action":"先暂停冲动承诺和公开对质，核对一项关键事实并安排支持；若现实中存在直接危险，应优先求助，不依赖牌面判断安全。"},"reflection":"被动摇的是已经确认的事实，还是我原本确信的一种解释？","micro_action":"写下一个已确认的事实，再做一件让当下稳定的小事。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/xvi-the-tower","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-tower-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_17","name":"星星","suit":"major","number":17,"keywords":["希望","修复","坦诚"],"image_cues":"星光下的人将两壶水分别倒向池塘与土地，一足触水，远处树上停着鸟。","meaning":"星星的传统意象关联希望、更新、坦诚与缓慢恢复，像在黑暗后重新找到方向。它不承诺愿望实现，也不要求用乐观覆盖尚未消退的失落。","positions":{"state":"你可以留意自己是否开始愿意相信某种可能，或仍需要慢慢恢复；希望可以很小，不必表现成已经完全释怀或重获信心。","need":"有空间修复、不被催着振作，以及能够真实表达脆弱，可能是你重视的需要；你可以期待更好，也承认目前仍然很难。","obstacle":"当希望只寄托于一个人的改变，生活可能被等待占满；检查自己是否用理想中的未来，替代了当下能观察到的事实。","resource":"已有的支持、曾经带来安定的小习惯和对未来仍有的一点愿望，可以逐步积累；资源不一定耀眼，能持续就有价值。","action":"选一个与任何人回应无关的小恢复行动，并给它留出时间；把希望落实为对自己的照顾，而不是要求关系立刻证明它。"},"reflection":"即使对方暂时没有回应，我还能为自己的生活保留什么希望？","micro_action":"写下一件未来一周愿意期待的小事，并安排十分钟准备。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/xvii-the-star","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-star-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_18","name":"月亮","suit":"major","number":18,"keywords":["模糊","想象","不安"],"image_cues":"月亮照着双塔间的蜿蜒小路，犬与狼抬头，水中甲壳动物爬向岸边。","meaning":"月亮的传统意象涉及模糊、想象、恐惧与信息不足时的感受。它不揭露隐瞒或背叛，也不能证实直觉；不安需要被照顾，事实仍需核实。","positions":{"state":"你可以观察自己是否在信息空白处补上了许多故事；感到不安并不丢脸，但先区分观察与想象，能减少被猜测牵着走。","need":"清楚的信息、可询问的空间和情绪被认真对待，可能是你重视的需要；你不必为了显得理性而否认害怕，也不必照单全收。","obstacle":"反复解读语气、在线状态或片段细节，可能扩大不确定；检查是否存在另一种普通解释，不将最担忧的故事当作唯一事实。","resource":"睡眠、熟悉的日常、清楚的记录和不煽动猜疑的人，可以帮助你稳定判断；先降低刺激，再决定哪些信息值得直接询问。","action":"把一个担忧改写为中性问题，在合适时机询问；若暂时无法核实，就暂存结论，不连续抽牌或反复搜寻来追求绝对确定。"},"reflection":"我现在最害怕的解释，还有哪些同样可能的替代解释？","micro_action":"为一个担忧写出两种替代解释，并标明哪些尚无证据。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/xviii-the-moon","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-moon-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_19","name":"太阳","suit":"major","number":19,"keywords":["明朗","活力","喜悦"],"image_cues":"明亮太阳照着骑白马的孩子，红旗向外展开，矮墙后生长着向日葵。","meaning":"太阳的传统意象关联清晰、活力、坦率与喜悦，强调能够被看见的生命力。它不保证关系顺利，也不意味着愉快时刻足以抵消未解决的问题。","positions":{"state":"你可以留意哪些互动让自己自然、轻松而有活力；承认真实的快乐，不必马上证明它会持续，也不必因此忽略其他复杂感受。","need":"坦率表达、共同享受日常和被欣赏而无需表演，可能是你重视的需要；你值得拥有轻松，不需要始终担任带动气氛的人。","obstacle":"若关系只容许开心，困难感受就可能无处安放；检查自己是否为了保住美好形象，忽略疲惫、不同意见或需要修补的地方。","resource":"已经出现的愉快经验、清楚的沟通和你自身的生命力，都可以成为资源；找出快乐为何发生，比只期待气氛回来更具体。","action":"选择一件真实而小的好事去表达欣赏，或安排低负担的共同活动；保持邀请而非考验，也允许彼此今天没有同样的兴致。"},"reflection":"在这段关系里，我能自然地快乐，也能诚实地不快乐吗？","micro_action":"记录一个让你轻松的具体互动，写清其中哪个细节有帮助。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/xix-the-sun","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-sun-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_20","name":"审判","suit":"major","number":20,"keywords":["回顾","回应","更新"],"image_cues":"云中的天使吹响带旗号角，下方人物从棺中起身，张开双臂面向声音。","meaning":"审判的传统意象指向召唤、回顾、觉醒与对新阶段的回应。它不是道德宣判，也不保证旧情复燃；更新需要面对过去，并作出实际改变。","positions":{"state":"你可以回看关系里反复出现的主题，思考自己现在是否有不同的理解；重点不是审判过去的自己，而是决定此刻如何回应。","need":"被允许改变、让重要经历得到承认，以及选择与现在价值相符的生活，可能是你重视的需要；新的理解不必被旧标签困住。","obstacle":"若回顾总变成自责或追究谁彻底错了，学习就难以发生；也要检查是否仅有“重新开始”的愿望，却没有不同的行动条件。","resource":"你从经历中得到的认识、愿意负责的能力和可信反馈，都能支持更新；承认局限不取消成长，也不要求你替别人承担后果。","action":"选一件过去的互动，写出学到什么及下次具体改哪里；是否重启关系应另看现实条件，不以这张牌作为复合的理由。"},"reflection":"如果真的重新选择，我会改变哪个具体行为，而不只是许愿？","micro_action":"写下一个想保留的经验和一个下次要调整的行为。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/xx-the-last-judgement","https://labyrinthos.co/blogs/tarot-card-meanings-list/judgement-meaning-major-arcana-tarot-card-meanings"]},{"id":"major_21","name":"世界","suit":"major","number":21,"keywords":["整合","完成","归属"],"image_cues":"花环中央的人持双杖起舞，四角各有一位生灵，红色丝带环绕花环。","meaning":"世界的传统意象关乎完成、整合、参与整体与阶段性的圆满。这里的完成不等于毫无缺憾，也不保证关系永恒；它可以容纳收获、边界与告别。","positions":{"state":"你可以回顾某段相处历程如何塑造了自己，以及哪些问题已有足够清楚的答案；完成一个阶段，不必等到每处细节都完美。","need":"既能归属于关系，也能保有完整生活，可能是你重视的需要；亲密可以与朋友、兴趣和自主并存，而不是占据全部身份。","obstacle":"追求“终于完全确定”的终点，可能让你看不见已有的进展；另一种阻力是因害怕下一阶段，而不断延长已经完成的课题。","resource":"你整合经验的能力、关系之外的生活支点和已经形成的有效习惯，都是资源；允许成果属于自己，不必只由别人认可才算数。","action":"为一个阶段做简短总结，确认收获、未竟事项和可以放下的部分；再选择一个小的生活安排，让关系回到更完整的生活中。"},"reflection":"什么已经足够完成，不需要再靠反复确认来证明？","micro_action":"写下三项已获得的经验，并为关系之外的一件事留出时间。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/xxi-the-world","https://labyrinthos.co/blogs/tarot-card-meanings-list/the-world-meaning-major-arcana-tarot-card-meanings"]},{"id":"cups_01","name":"圣杯一","suit":"cups","number":1,"keywords":["开放","滋养","情感萌芽"],"image_cues":"云中伸出的手托住溢水圣杯，白鸽向下飞来，池面浮着睡莲。","meaning":"传统正位把这只丰盈的杯与喜悦、滋养和真心相连；当代常用它表示情感的开启。它强调容纳感受的可能，而非保证恋情结果。","positions":{"state":"你可以留意自己是否正有一些想分享的温柔或新感受；重点是承认它们，而不是立刻确认对方是否同样热烈。","need":"你可能重视一种能自然表达感受的空间，不必先表现完美才值得被关心，也不必用付出来换取回应。","obstacle":"值得检查你是否把一次情感涌动当成长久承诺，或急着填满所有空白；感受真实，不代表判断已经完整。","resource":"可以寻找让你情绪得到滋养的小事与可靠关系，先让自己的杯里有水，再决定愿意分享多少关心。","action":"挑选一个容易说出口的真实感受，用“我感到”开头表达；只邀请倾听，不要求对方立即给出等量回应。"},"reflection":"我现在最愿意承认的感受是什么？","micro_action":"写下一句不带要求的感受，先保留给自己。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/ace-of-cups","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-cups/"]},{"id":"cups_02","name":"圣杯二","suit":"cups","number":2,"keywords":["互惠","连接","相互尊重"],"image_cues":"两个人面对面各持一杯，上方是交缠双蛇杖与带翅膀的狮头。","meaning":"传统正位关联亲近、友谊、契合与联合。两杯相对表现彼此回应的结构；放在关系里可谈互惠，但不能据此断定另一人的感情。","positions":{"state":"你可以观察最近的互动是否有来有往，包括表达、倾听和决定；连接的质量比单方面投入的多少更值得注意。","need":"你重视的可能是平等被对待：自己的意见有人听见，也能真心听取对方，而不是只有一人决定靠近的方式。","obstacle":"值得检查你是否把一致当作亲密的唯一证明，或为了维持和气隐藏不同意见；互惠并不要求两个人完全相同。","resource":"可以回想一次双方都感到被尊重的交流，找出其中可重复的做法，例如先问意愿、轮流表达和确认理解。","action":"提出一段短时间的双向交流，先各说一件近期在意的事，再复述听到的内容，不急着替对方下结论。"},"reflection":"我怎样分辨互相靠近与单方面迎合？","micro_action":"为一次十分钟的交流拟一个双方都能回答的问题。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/two-of-cups","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-cups/"]},{"id":"cups_03","name":"圣杯三","suit":"cups","number":3,"keywords":["庆祝","友谊","支持"],"image_cues":"三个人在花园里高举圣杯，脚边可见果实与植物，形成相聚的场面。","meaning":"传统正位强调欢庆、圆满与安慰；当代也重视友谊和群体支持。三人的图像指向共享喜悦，不是第三者存在的证据。","positions":{"state":"你可以留意生活里是否还有恋爱之外的轻松联结；共同庆祝与朋友陪伴，可能正在影响你面对关系的余裕。","need":"你可能需要被接纳的群体感，也希望亲密关系允许各自保有友情，不把所有快乐和支持压在一个人身上。","obstacle":"值得检查你是否为了合群而忽略自己的节奏，或让外界意见代替你判断关系；热闹不一定等于真正被理解。","resource":"可以寻找尊重隐私、不煽动对立的朋友与共同兴趣，让支持来自多个方向，而不是让朋友替你审判伴侣。","action":"选一件确实值得肯定的小事，为它安排简单的庆祝；若邀请他人参与，先确认自己愿意分享的范围。"},"reflection":"谁能支持我，同时尊重我的自主决定？","micro_action":"给一位可靠朋友发一句不涉及伴侣隐私的问候。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/three-of-cups","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-cups/"]},{"id":"cups_04","name":"圣杯四","suit":"cups","number":4,"keywords":["倦怠","停顿","重新审视"],"image_cues":"人物坐在树下交抱双臂，面前三杯，云中另有一只手递来第四杯。","meaning":"传统正位包含厌倦、不满及面对馈赠仍难满足的状态；当代常加入内省。它允许看见情感停滞，不把每次退缩都解释成成长。","positions":{"state":"你可以检查自己是否对熟悉互动失去兴趣，或暂时没有接纳关心的力气；先分辨疲惫、无聊与真正的不合适。","need":"你可能需要安静与选择权，不被催促感恩或马上热情回应，同时也需要诚实辨认自己究竟缺少什么。","obstacle":"值得检查你是否只盯着没有得到的东西，忽略实际存在的选择；也不必因有人示好就强迫自己接受。","resource":"可以借助一段没有消息干扰的休息，重新感受什么让你有反应；资源可能是恢复辨别能力，而不是更多刺激。","action":"为自己留出短暂空白，写下不想要与想尝试的各一项；等状态清楚一点，再决定是否回应某个邀请。"},"reflection":"我现在需要休息，还是需要不同的相处方式？","micro_action":"安静坐五分钟，记下自己最明显的一种感受。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/four-of-cups","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-cups/"]},{"id":"cups_05","name":"圣杯五","suit":"cups","number":5,"keywords":["失落","遗憾","尚存之物"],"image_cues":"披黑斗篷的人低头看着三只倒杯，身后两杯仍立，远处有桥与建筑。","meaning":"传统正位明确包含损失、失望及未达预期，同时留下尚存之物。两只立杯不取消痛苦，也不要求人立即积极起来。","positions":{"state":"你可以承认某次落空仍在影响自己，而不把难过说成小题大做；此刻注意力停在损失上，也值得被温和理解。","need":"你可能需要有人认真听见遗憾，不急着劝你想开；也需要时间区分失去的事实与你对整个关系的结论。","obstacle":"值得检查你是否把一次失望扩展成一切都没有意义，或反过来用尚有好处逼自己跳过悲伤与必要的修复。","resource":"可以寻找仍可靠的支持、习惯和个人能力；它们不是要求你原谅的理由，而是让你承受失落时不只剩孤立。","action":"把确实失去的、仍然拥有的分成两栏，允许第一栏难受；今天只选择一件能照顾自己的事，不急着做大决定。"},"reflection":"这次失望具体伤到了我哪一项期待？","micro_action":"用三句话记录失望经过，只写事实与自己的感受。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/five-of-cups","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-cups/"]},{"id":"cups_06","name":"圣杯六","suit":"cups","number":6,"keywords":["回忆","善意","熟悉感"],"image_cues":"庭院里一人向另一人递出盛花的杯，周围也有花杯，远处有人离开。","meaning":"传统正位多关联过去、回忆及昔日快乐；图中的赠花也常被读作单纯善意。回望可以滋养当下，但不是过去必然重演的承诺。","positions":{"state":"你可以留意最近是否常用过去的温暖来理解现在；熟悉感令人安心，但眼前的人与相处条件可能已经变化。","need":"你可能重视朴素而不需表演的关心，希望小小善意也被看见，不必每次都靠隆重安排证明关系重要。","obstacle":"值得检查你是否只记得美好片段，或要求现在完全复刻从前；回忆能提示需要，却不能替代当下的事实。","resource":"可以从一段舒服的旧经历里提取可用元素，例如耐心、玩心与简单陪伴，而不是要求过去的场景原样回来。","action":"挑一种过去喜欢、现在仍合适的轻松活动，先问自己还想不想做；若邀请伴侣，给对方自由选择的空间。"},"reflection":"我怀念的是某个人、某个时刻，还是一种感受？","micro_action":"记下一段温暖回忆，以及其中今天仍可做到的一件小事。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/six-of-cups","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-cups/"]},{"id":"cups_07","name":"圣杯七","suit":"cups","number":7,"keywords":["想象","选择","辨别"],"image_cues":"人物面对云中七只圣杯，杯里出现宝物、城堡、蛇与不同的奇异形象。","meaning":"传统正位重在幻想、映像与缺少稳固实质的可能；当代也谈多重选择。丰富想象能启发探索，却不能当作已经发生的事实。","positions":{"state":"你可以观察自己是否同时设想许多关系走向，难以选定关注点；先分清已发生的事与脑中不断展开的剧情。","need":"你可能需要更清楚的选择标准，而非更多猜测；知道自己看重什么，能帮助你从诱人的可能里找到现实方向。","obstacle":"值得检查你是否把期待或担心当作证据，或以不断设想替代询问；最鲜明的画面不一定最接近实际情况。","resource":"可以寻找可核实的信息与自己的优先顺序，把可能性放回不同可信度的位置，让想象服务探索而非替代判断。","action":"只挑一个当前能验证的问题，写清已知、未知和希望；必要时用开放问题求证，不拿牌面要求对方承认猜想。"},"reflection":"我正在把哪一个想象误当作事实？","micro_action":"画出事实、猜测、愿望三栏，各写一条。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/seven-of-cups","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-cups/"]},{"id":"cups_08","name":"圣杯八","suit":"cups","number":8,"keywords":["疏离","转向","意义追寻"],"image_cues":"人物背对排列的八只杯，持杖走向崎岖山地，天空悬着月亮。","meaning":"传统图像表现离开曾在意的事物，原著也记录不同解释；当代常谈失望后的转向。它提示检视投入，不直接命令结束关系。","positions":{"state":"你可以留意自己是否对某种重复相处渐感空缺，想暂时抽离；先辨认离开的究竟是一个模式，还是一段关系。","need":"你可能需要更有意义的联结，也需要承认某些满足感已经改变；持续投入不应只因为曾经花了很多时间。","obstacle":"值得检查你是否用消失回避必要表达，或因不舍过去投入而继续忽略长期空缺；两种方向都需要现实依据。","resource":"可以寻找独处整理的时间与可信赖的外部支持，让你有空间想清楚愿意保留什么、必须改变什么。","action":"先给一种消耗你的互动设定短暂停顿与重谈时间，避免突然失联；重大去留决定留待事实与自身需要更清楚时。"},"reflection":"我想离开的，是哪些具体相处方式？","micro_action":"写下一个想暂停的模式和一个希望替代它的做法。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/eight-of-cups","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-cups/"]},{"id":"cups_09","name":"圣杯九","suit":"cups","number":9,"keywords":["满足","享受","个人愿望"],"image_cues":"人物坐在长凳上交抱双臂，身后弧形台面陈列九只圣杯。","meaning":"传统正位与满足、舒适、成功相关；当代常称愿望牌。它可象征欣赏现有的丰足，而不是证明每个愿望都会实现。","positions":{"state":"你可以留意哪些相处时刻确实让你满足，不只追赶下一个目标；也看看这份满足是否包含你自己的真实偏好。","need":"你可能需要享受已拥有的快乐，以及不必靠伴侣认可才成立的个人满足；亲密并不要求所有喜好完全共享。","obstacle":"值得检查你是否把眼前舒服当作问题都已解决，或只衡量自己的满意；满足可以被珍惜，也仍需要听见差异。","resource":"可以寻找已经有效的自我照顾与生活乐趣，让快乐有稳定来源；这样分享喜悦时，不必把对方当成唯一供给。","action":"选择一件小而具体的满足，认真享受并表达感谢；同时留意是否有未被照顾的需要，不用庆祝把它压下去。"},"reflection":"怎样的满足是真正属于我，而不是展示给别人看的？","micro_action":"写下今天三件让我舒服的小事。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/nine-of-cups","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-cups/"]},{"id":"cups_10","name":"圣杯十","suit":"cups","number":10,"keywords":["归属","共同幸福","和谐"],"image_cues":"十只杯沿彩虹排列，下面的人举手相望，孩子玩耍，远方可见住宅。","meaning":"传统正位象征心意安顿、友爱与圆满；当代常谈共同生活的和谐。图中的家庭是象征之一，并不限定关系必须结婚或育儿。","positions":{"state":"你可以检视自己对共同生活的想象是否清晰，包括安心、欢乐与归属；这些理想需要落在真实日常，而非只在画面中。","need":"你可能重视一种可共同定义的归属感，让双方都能参与幸福的标准，不必照搬家庭或社会规定的生活模板。","obstacle":"值得检查你是否为了维持看起来幸福而压下分歧，或默认对方拥有同一个未来蓝图；和谐不能靠一人沉默维持。","resource":"可以寻找双方已经共同珍惜的日常与价值，例如互相照顾或保留独处；这些具体交集比完美形象更可持续。","action":"先描述理想普通一天里的三件小事，再邀请对方分享版本；寻找一处可尝试的交集，不把讨论变成承诺考试。"},"reflection":"我的幸福图景中，有多少是我真正选择的？","micro_action":"写一段不涉及身份要求的理想日常。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/ten-of-cups","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-cups/"]},{"id":"cups_11","name":"圣杯侍从","suit":"cups","number":11,"keywords":["好奇","柔软","情感学习"],"image_cues":"海边的人捧着一只杯，杯口探出一条鱼，人物好奇地看着它。","meaning":"传统正位包含讯息、思考与学习；杯中鱼带来意外想象。当代常读作情感好奇和创意萌芽，此处仅取角色品质，不指年龄性别。","positions":{"state":"你可以给尚未说清的感受一点好奇，不急着判断它成熟与否；第一次学着表达柔软，也可能显得笨拙但真实。","need":"你可能需要允许试错的交流环境，让小小的善意、道歉或想法可以出现，不因表达不够漂亮就被嘲笑。","obstacle":"值得检查你是否把一时直觉当成对方内心的答案，或害怕显得幼稚而压住表达；好奇适合提问，不适合断言。","resource":"可以寻找创意表达方式，例如简短文字、画画或共同玩心，让难以命名的情绪先有一个安全的入口。","action":"试着表达一个小感受或善意，再留出回应空间；把这次交流当作练习，而不是验证自己是否值得被爱的考试。"},"reflection":"如果不用表现成熟，我最想说哪句真话？","micro_action":"写一条两句话以内的善意表达，先读给自己听。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/page-of-cups","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-cups/"]},{"id":"cups_12","name":"圣杯骑士","suit":"cups","number":12,"keywords":["邀约","浪漫","表达"],"image_cues":"骑者轻缓地骑着白马，手持圣杯向前，盔饰带翼，旁边流过河水。","meaning":"传统正位谈接近、提议和邀请，图像姿态温和；当代强调浪漫想象与情感行动。这里指表达方式，不是某种性别或命定来客。","positions":{"state":"你可以观察自己是否想把感受化成邀请或仪式，主动让关系多一点温柔；同时分辨美好表达与可兑现的行动。","need":"你可能重视被认真邀请和细心对待，也希望心意的表达有个人特色，而不只是完成一套标准恋爱流程。","obstacle":"值得检查你是否沉迷理想场景而忽略时间、预算和意愿，或把浪漫提议变成要求对方配合的压力。","resource":"可以寻找自己擅长的表达媒介，以及对方明确说过的喜好；让想象力与真实信息合作，而不是猜测其心意。","action":"提出一个小而具体、允许拒绝的邀请，说明大致时间与安排；把重点放在共享体验，不用昂贵或夸张来证明诚意。"},"reflection":"我想表达心意，还是想获得特定反应？","micro_action":"拟一个可以轻松拒绝或改期的低成本约会邀请。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/knight-of-cups","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-cups/"]},{"id":"cups_13","name":"圣杯王后","suit":"cups","number":13,"keywords":["共情","关怀","细腻"],"image_cues":"海岸边的王后注视带盖的精致圣杯，双脚靠近水面，宝座有水生装饰。","meaning":"传统正位关联关爱、奉献与有行动的感受力；当代常强调共情。这里将王后视为细腻关怀的角色品质，不对应现实性别或身份。","positions":{"state":"你可以留意自己是否格外关注情绪的细微变化，也检查有没有把照顾别人放得太前，以至于听不见自己的感受。","need":"你可能需要被温柔听见，而不是马上被分析或纠正；同时希望关怀有边界，不必替另一个人处理所有情绪。","obstacle":"值得检查你是否将敏感感受当作读心能力，或因理解对方而撤回自己的需要；共情与同意并不是一回事。","resource":"可以寻找能容纳复杂感受的倾听者，以及帮助你命名情绪的记录方式；先看清自己的水位，再决定如何照顾关系。","action":"交流前先说清你此刻需要倾听还是建议，也询问对方的需要；只承担自己愿意且能够承担的那一部分。"},"reflection":"我能否在关心对方时，也为自己留下位置？","micro_action":"写下我现在的情绪、需要与一个照顾边界。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/queen-of-cups","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-cups/"]},{"id":"cups_14","name":"圣杯国王","suit":"cups","number":14,"keywords":["稳重","调节","宽厚"],"image_cues":"国王坐在海上石座，手持杯与短杖，身旁浪中可见鱼与远处船只。","meaning":"传统正位包括责任、公平和助人；当代常读作情绪成熟与温和协调。海浪中的稳定是可练习的品质，不表示某人没有情绪。","positions":{"state":"你可以检查自己如何面对起伏：是否能承认难受，又不让一时冲动决定表达；稳定不等于隐藏所有波动。","need":"你可能需要一种可预期且尊重感受的交流方式，允许情绪存在，同时不以威胁、冷落或失控迫使任何人让步。","obstacle":"值得检查你是否把冷静变成居高临下，或为了充当可靠的人始终不求助；真正负责也包括承认自己的限度。","resource":"可以寻找已经奏效的调节方法、清晰表达和可靠支持，让你在讨论困难议题时仍能守住尊重与判断力。","action":"遇到情绪上升时先标记感受，必要时提出暂停并约定再谈；回来后用事实、感受和请求分别表达。"},"reflection":"我的冷静是有空间容纳感受，还是把感受藏起来？","micro_action":"给自己写一条有明确返回时间的暂停沟通句。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/king-of-cups","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-cups/"]},{"id":"wands_01","name":"权杖一","suit":"wands","number":1,"keywords":["火花","开端","创造"],"image_cues":"一只手从云中伸出握住长出新叶的权杖，远处有河流、山丘与城堡。","meaning":"传统正位关联创造、发起与事业开端；当代也重视热情与潜能。萌芽代表值得探索的动力，不代表事情已具备成功条件。","positions":{"state":"你可以留意什么相处想法重新点亮了自己的兴趣；这股动力值得记录，但不用马上把一个念头变成长远计划。","need":"你可能需要关系中有主动创造和尝试的余地，不只是维护既有安排；热情可以从小事开始，不必靠强烈刺激维持。","obstacle":"值得检查你是否把兴奋当作充分准备，或希望对方立刻以同样速度投入；新的火花也需要条件与共同意愿。","resource":"可以寻找让你感到有活力的活动、灵感和空闲时间，把热情放进可承受的小实验，而不是一次耗尽精力。","action":"挑一个能在短时间完成的新尝试，先确认双方兴趣与边界；做完再看真实感受，不提前许诺它会改变一切。"},"reflection":"我想尝试什么，而不是证明什么？","micro_action":"写下一个无需花钱、二十分钟以内的新活动。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/ace-of-wands","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-wands/"]},{"id":"wands_02","name":"权杖二","suit":"wands","number":2,"keywords":["视野","规划","选择"],"image_cues":"人物站在城墙上手持地球，身旁两根权杖，一根握住，一根固定在墙上。","meaning":"原著呈现拥有与不满足并存的复杂读法；当代多强调规划与选择。望向远处的姿态，可作审视现有位置与未来可能的象征。","positions":{"state":"你可以看看自己是否处于想改变却尚未行动的阶段；眼前的稳定与远处的可能都重要，不必急着否定任何一边。","need":"你可能需要参与共同方向的决定，清楚知道有哪些选择及各自代价，而不只是配合一个已经替你安排好的未来。","obstacle":"值得检查你是否一直规划却不收集实际信息，或把安全与探索看成非此即彼；宏大蓝图也可能掩盖具体犹豫。","resource":"可以寻找可比较的现实条件、时间与个人优先级，把模糊向往转为几个清楚选项，保留调整方向的空间。","action":"列出两个可行的小方向，各写一项吸引点和一项代价；先选择需要补充的信息，而不是立即作重大承诺。"},"reflection":"我是在选择想要的方向，还是只想逃离眼前？","micro_action":"对一个共同计划列出两个方案及待确认的问题。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/two-of-wands","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-wands/"]},{"id":"wands_03","name":"权杖三","suit":"wands","number":3,"keywords":["拓展","远见","等待反馈"],"image_cues":"人物背向观看者站在高处，三根权杖立在身旁，视线越过海上的船只。","meaning":"传统正位涉及已建立的力量、探索及合作；当代强调拓展与远见。它呈现行动之后看向外部的阶段，而非空想或保证收获。","positions":{"state":"你可以检查哪些努力已经迈出第一步，现在需要观察反馈；与其频繁催促结果，不如区分等待与真正缺少行动。","need":"你可能需要关系允许双方成长与拓展，也希望共同计划能顾及更长时间，而不只围绕眼前的情绪反应。","obstacle":"值得检查你是否把期待投得太远，忽略眼下的分工与资源，或认定只要开始过就不必再检视是否适合继续。","resource":"可以寻找已有进展、外部经验与可协作的资源，让下一步有依据；他人的经验能开阔视野，但不能代替自己的选择。","action":"给一项已开始的共同尝试设一个回顾时点，明确要观察什么；在此之前做好自己能做的部分，避免反复试探。"},"reflection":"我已经做了什么，又在等待哪一种实际反馈？","micro_action":"为一个已启动的小计划写下回顾日期与观察指标。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/three-of-wands","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-wands/"]},{"id":"wands_04","name":"权杖四","suit":"wands","number":4,"keywords":["安顿","庆祝","共同空间"],"image_cues":"四根权杖撑起花环，两个人举起花束，背后是通向建筑的道路与人群。","meaning":"传统正位象征休憩、庇护、和谐与收获后的欢庆；当代也谈归家。它关注可感受到的安稳，不是婚礼或同居必然发生的预告。","positions":{"state":"你可以留意哪里让你在关系中感到放松，是否有能够一起庆祝的小成果；安稳也需要被注意，而非只在冲突时回顾。","need":"你可能需要一个可放心休息的共同空间，无论是固定时间、熟悉地点还是相处方式，不必靠重大身份变化才成立。","obstacle":"值得检查你是否把形式上的仪式当作安全感的全部，或忙着让场面漂亮而忽略双方是否真的舒适自在。","resource":"可以寻找已经让双方安心的习惯与环境，让它成为日常支点；小范围的稳定节奏，可能比隆重安排更可持续。","action":"安排一个低压力的相聚或庆祝，先确认时间与舒适度；保留简单、可退出的设计，不把开心变成必须完成的任务。"},"reflection":"什么具体环境让我不必紧绷或表现？","micro_action":"整理一个能舒适相处的小角落，或预留一段无任务时间。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/four-of-wands","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-wands/"]},{"id":"wands_05","name":"权杖五","suit":"wands","number":5,"keywords":["分歧","竞争","磨合"],"image_cues":"五个人各举一根权杖，姿态方向交错，像是在混乱地练习或争执。","meaning":"传统正位包含模拟争斗与竞争，当代常谈冲突及多种意见。它承认摩擦会消耗精力，但不据此判定关系注定失败。","positions":{"state":"你可以观察目前的摩擦到底围绕什么，是目标不同、方法不同，还是大家都在争取被听见；先缩小争论范围。","need":"你可能需要公平表达不同意见的机会，也需要明确的讨论规则，让分歧不至于成为谁声音更大谁就赢。","obstacle":"值得检查你是否把协商变成输赢，或同时翻出多个议题使讨论失焦；对抗姿态可能遮住原本能够处理的具体问题。","resource":"可以寻找中性的事实、轮流发言与单一议题的讨论方式；存在差异不等于失去合作，但合作需要实际规则。","action":"只选一个分歧讨论，先各说最在意的点，再寻找一项可试行的安排；若出现辱骂或威胁，优先停止不安全交流。"},"reflection":"我真正想解决什么，而不是想赢过什么？","micro_action":"把最近的一次争执改写成一个具体、可讨论的问题。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/five-of-wands","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-wands/"]},{"id":"wands_06","name":"权杖六","suit":"wands","number":6,"keywords":["认可","进展","信心"],"image_cues":"戴桂冠的人骑马前行，手中权杖也有花冠，周围的人持杖相随。","meaning":"传统正位与胜利、好消息和期待达成有关；当代重视被认可与自信。它可提示看见真实进展，而不是保证竞争胜利或他人赞许。","positions":{"state":"你可以注意自己最近完成了哪些有价值的努力，以及哪些认可真正让你受鼓舞；不必等到完美才承认小进步。","need":"你可能需要贡献被具体看见，而非只有出错时被注意；也希望在关系里能互相肯定，而不是争夺谁更值得赞赏。","obstacle":"值得检查你是否过度依赖外界赞美，或把共同进展全部归给自己；被认可的愿望不应让另一人的劳动消失。","resource":"可以寻找有事实依据的肯定与过往成功经验，用它们增强行动信心；同时记得那些帮助进展发生的人和条件。","action":"向自己或伴侣指出一件具体有效的行为，并说明它带来的帮助；让赞赏落在行动上，而不是笼统评判人的价值。"},"reflection":"我希望哪一种努力被看见？","micro_action":"写下一项近期进步，以及促成它的具体行为。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/six-of-wands","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-wands/"]},{"id":"wands_07","name":"权杖七","suit":"wands","number":7,"keywords":["坚持","界限","应对挑战"],"image_cues":"一个人站在高处横持权杖，下方伸出六根权杖，脚下地面并不平整。","meaning":"传统正位强调勇气、争辩与有利位置上的抵御；当代也谈保护界限。它允许坚持立场，却不证明所有不同意见都是攻击。","positions":{"state":"你可以检查自己是否正努力守住某个重要立场，感到需要解释或防御；先明确你保护的是什么，而不只盯着反对。","need":"你可能需要自己的决定与边界被尊重，即使对方并不完全认同；亲密不应以放弃所有个人立场为条件。","obstacle":"值得检查你是否把每个提问都当作挑战，或者为了证明坚定拒绝任何调整；边界与固执需要靠具体情境区分。","resource":"可以寻找清楚的底线说明、可选择的替代方案与支持者；知道自己能接受什么，能减少在压力下反复争辩。","action":"用一句话说明一条当前重要的界限，再给出愿意讨论的范围；无需重复证明自己有资格拥有这条界限。"},"reflection":"我正在守护哪项重要需要，哪些部分仍可协商？","micro_action":"写出一条界限及一个不越界的替代选择。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/seven-of-wands","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-wands/"]},{"id":"wands_08","name":"权杖八","suit":"wands","number":8,"keywords":["推进","速度","信息流动"],"image_cues":"八根长出叶子的权杖斜向掠过天空，下方可见河流、田野与远处建筑。","meaning":"传统正位强调活动、迅速与接近目标，也包含情感的箭；当代常谈快速消息和推进。速度是主题，不保证某人即将联系。","positions":{"state":"你可以留意最近的安排与消息是否变得密集，关系节奏是否快过你的消化速度；推进时仍需要知道自己是否愿意。","need":"你可能需要清晰及时的信息和协调，也需要有权说慢一点；交流顺畅并不等于任何时刻都必须立即回复。","obstacle":"值得检查你是否在忙乱中默认同意，或因为消息来得快就省略核实；速度可能放大误解，也可能掩盖不同步。","resource":"可以寻找简洁的确认方式与明确优先级，把零散消息收束成可执行安排；有节奏的回应比连续催促更能帮助推进。","action":"把一个正在快速变化的安排确认清楚，包括时间、意愿与下一步；若自己跟不上，直接提出需要的缓冲时间。"},"reflection":"现在的速度是我愿意的，还是我不敢提出放慢？","micro_action":"将一项散落在多条消息里的安排整理成三点确认。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/eight-of-wands","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-wands/"]},{"id":"wands_09","name":"权杖九","suit":"wands","number":9,"keywords":["警觉","韧性","保留余力"],"image_cues":"额头缠带的人扶着一根权杖警觉站立，身后八根权杖排成围栏。","meaning":"传统正位指面对抵抗时的力量，也可能带来延迟与停顿；当代强调韧性和边界。坚持值得尊重，但疲惫与警觉也是真实代价。","positions":{"state":"你可以承认自己可能已经努力很久，仍习惯随时防备下一次困难；先辨认当下是否真的有危险，而非自动进入应战。","need":"你可能需要安全感、恢复时间与可守住的界限，不必靠一直坚强证明关系重要，也不必在疲惫时立刻继续争论。","obstacle":"值得检查你是否因过去的不愉快而预先抵挡每次靠近，或把坚持理解成绝不能休息；保护自己也需要更新现实判断。","resource":"可以寻找曾帮助你渡过困难的方法，并检查现在是否仍适用；可靠支持与适度休息也是韧性的一部分。","action":"给自己设定本次沟通能投入的时间和暂停信号，先恢复一点余力；面对反复越界，关注实际行为而不是新的保证。"},"reflection":"我此刻的警觉基于什么具体事实？","micro_action":"列出一项当前事实、一项旧经验，以及今天需要的休息。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/nine-of-wands","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-wands/"]},{"id":"wands_10","name":"权杖十","suit":"wands","number":10,"keywords":["负担","责任","过量承担"],"image_cues":"人物弯身抱着十根权杖向前走，视线受到遮挡，前方有一片建筑。","meaning":"传统正位以压迫和沉重为核心，也提到成功带来的负担；当代重视过量责任。它不美化硬撑，完成目标也可能需要减少承担。","positions":{"state":"你可以盘点自己是否把太多安排、照顾与协调扛在身上，以至于没有力气享受关系；忙碌不等于分工已经公平。","need":"你可能需要可持续的分担和明确责任，而不只是被称赞能干；你有权提出某些工作需要转交、减少或停止。","obstacle":"值得检查你是否默认只有自己做才可靠，或一直答应却期待对方自动发现疲惫；过量承担可能让问题越来越隐形。","resource":"可以寻找一份可见的任务清单与真实可用的帮助，让负担从个人感受变成可以协商的事项，而不是继续靠意志硬撑。","action":"选一项并非只能由你完成的任务，说明它占用的时间与希望怎样分担；先减少一件事，不在疲惫时重新接下全部。"},"reflection":"哪一项责任是我默认接下，却从未真正协商过的？","micro_action":"列出本周承担的事项，圈出一项可以协商或暂缓的。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/ten-of-wands","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-wands/"]},{"id":"wands_11","name":"权杖侍从","suit":"wands","number":11,"keywords":["探索","热忱","初步尝试"],"image_cues":"人物站在干燥开阔的地面，专注看着手中长叶的权杖，远处有沙丘。","meaning":"传统正位包含传讯、忠实和花色的活力；当代常谈探索与新点子。这里将侍从视为愿意学习的角色，不对应年龄或具体人物。","positions":{"state":"你可以留意自己对什么新体验感到好奇，即使还没有熟练方法；这种探索不必立刻承担改变关系的重大任务。","need":"你可能需要允许提想法、问问题和尝试的空间，不因缺少经验就被否定，也不必把每个兴趣都发展成固定承诺。","obstacle":"值得检查你是否不断提出新点子却不做最小尝试，或只在新鲜时投入；好奇心需要一个可完成的落脚点。","resource":"可以寻找入门材料、轻量活动和开放提问的态度，先学习而不是表演能力；一点点实践能帮助你辨别真实兴趣。","action":"挑一个双方可能感兴趣的小主题，先做短时体验或交换看法；保留不喜欢也没关系的余地，不要求立刻长期投入。"},"reflection":"我愿意以新手身份尝试什么？","micro_action":"为一个新想法列出只需十分钟的第一步。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/page-of-wands","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-wands/"]},{"id":"wands_12","name":"权杖骑士","suit":"wands","number":12,"keywords":["行动","冒险","冲劲"],"image_cues":"骑者举着短杖，坐骑前腿扬起，盔甲饰有羽状装饰，背景是干燥山丘。","meaning":"传统正位谈启程、迁移与急促行动；当代强调热情、冒险和冲劲。此处是行动风格的象征，不据此判断任何人的可靠程度。","positions":{"state":"你可以观察自己是否很想马上做点什么，打破停滞或重复；动力充沛时，也要给现实条件与他人意愿留位置。","need":"你可能需要活力、变化和自主行动的空间，也希望共同体验不总被无限推迟；同时要分清主动与替别人做主。","obstacle":"值得检查你是否因一时热情作出超出能力的承诺，或用冒险制造亲密；行动的强度不能替代持续的尊重。","resource":"可以寻找明确的预算、时间边界与可退出安排，让冲劲有安全的轨道；一次适量尝试比冲过头更能留下好经验。","action":"把想立刻执行的计划缩成低成本版本，先确认双方同意再行动；结束后留一点时间观察感受，而不是马上加码。"},"reflection":"我的冲劲有没有给双方留下说不的余地？","micro_action":"给一个想尝试的活动设时间与花费上限。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/knight-of-wands","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-wands/"]},{"id":"wands_13","name":"权杖王后","suit":"wands","number":13,"keywords":["自信","温暖","自主"],"image_cues":"王后坐在有狮子纹样的宝座上，手持权杖与向日葵，脚边有一只黑猫。","meaning":"传统正位强调生机、热情与亲和力；当代常谈自信和独立。这里以王后代表温暖而自主的角色品质，不套用性别或外貌描述。","positions":{"state":"你可以看看自己是否愿意在关系里显露真实喜好、能力与热情；不缩小自己，也不需要靠压过别人来证明存在感。","need":"你可能需要被尊重为有独立生活的人，同时保有温暖联结；吸引力不必建立在时刻迎合或随叫随到之上。","obstacle":"值得检查你是否把自信表现成必须主导气氛，或因害怕不被喜欢而藏起偏好；自在与讨好带来的感受并不相同。","resource":"可以寻找使你恢复自我感的兴趣、朋友与擅长之事，让热情来自自己的生活；拥有独立支点也能让分享更轻松。","action":"明确表达一个真实偏好，并邀请而非要求对方参与；若双方兴趣不同，也允许自己享受一段独立的活动时间。"},"reflection":"我在哪些时刻最像自己，而不必争取批准？","micro_action":"为本周保留一小段属于个人兴趣的时间。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/queen-of-wands","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-wands/"]},{"id":"wands_14","name":"权杖国王","suit":"wands","number":14,"keywords":["远见","带领","负责"],"image_cues":"国王手持长叶权杖坐在宝座上，座背与衣饰可见狮子、蜥蜴等图案。","meaning":"传统正位关联热情、诚实与责任感；当代常谈远见和领导力。这里指带动行动的角色品质，不指性别、地位或控制他人的权利。","positions":{"state":"你可以检查自己是否正在为共同事情定方向、推动行动；带头时也要确认这确实是共同目标，而不只是你的想法。","need":"你可能需要有方向且能落实的合作，不只有热情口号；同时希望责任与决定权能被清楚讨论，而非默认由一人主导。","obstacle":"值得检查你是否把看得更远当作替双方决定的理由，或只提目标却忽略执行负担；担当需要允许反馈与调整。","resource":"可以寻找清晰愿景、可分担的步骤以及愿意听取反馈的能力；真正可用的带领，是让参与者更有自主性。","action":"对一个共同目标提出简短草案，说明自己愿承担的部分，再邀请对方修改；先确认共识，再推进可逆的一小步。"},"reflection":"我是在邀请共同创造，还是希望对方追随我的方案？","micro_action":"写下一个共同目标、自己可承担的步骤和一个征求意见的问题。","source_urls":["https://sacred-texts.com/book/the-pictorial-key-to-the-tarot/king-of-wands","https://biddytarot.com/tarot-card-meanings/minor-arcana/suit-of-wands/"]},{"id":"swords_01","name":"宝剑一","suit":"swords","number":1,"keywords":["清晰","辨识","直言"],"image_cues":"云中伸出的手握住直立长剑，剑尖穿过王冠，远处山峰清晰而陡峭。","meaning":"宝剑一常象征思路打开、明确判断与表达的力量。锋利既能切开混乱，也可能伤人；它邀请你把真正的问题说清，而不是把一时的确定当成全部事实。","positions":{"state":"你可能正想替一段模糊的互动找到准确说法。先区分发生了什么、你如何解释它，让清晰来自证据而非反复猜测。","need":"你重视坦白且不绕弯的沟通，希望自己的问题能被认真回应。清晰的期待与可讨论的边界，可能比漂亮承诺更让你安心。","obstacle":"需要检查的是，急于得到一句定论，是否让你忽略了尚未确认的信息。表达得有力不等于必须立即判定谁对谁错。","resource":"可寻找的资源是你的辨别力，以及愿意把话说明白的沟通环境。把复杂感受整理成一个具体问题，会让对话更有着力点。","action":"先写下一个你确实观察到的事实，再写它带来的感受与疑问。若适合沟通，用求证的语气发问，不替对方填写答案。"},"reflection":"我想弄清的是一个事实，还是想立刻消除所有不安？","micro_action":"把一条困扰分成「事实／解释／待确认」三行。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"swords_02","name":"宝剑二","suit":"swords","number":2,"keywords":["僵持","权衡","暂缓"],"image_cues":"蒙眼的人坐在海边，双臂交叉持剑，身后水面散布礁石与弯月。","meaning":"宝剑二常象征维持平衡时的僵持、两难与暂缓判断。安静不一定意味着问题已经解决，也可能是在保护自己，等待足够的信息与承受选择的空间。","positions":{"state":"你可能同时看见两种选择的理由，却不愿轻易放弃任何一边。此刻的停顿值得被理解，也需要看见它是否正在拖累你。","need":"你需要不被催促的思考空间，希望在表达犹豫时仍受到尊重。可允许自己暂时没有答案，同时保有日后重新讨论的权利。","obstacle":"待检查的阻力是，把不看、不谈当成唯一的安全方式。若关键事实一直缺席，再多的内心权衡也可能只能原地打转。","resource":"你可以借助清楚的选择条件与一个适度的观察期限。让可信任的人帮你复述两边的代价，而不是替你决定该选谁。","action":"挑出一个最影响判断、又能够现实核实的问题。先收集这项信息，并约定自己何时再看，不必今天解决整个关系。"},"reflection":"我暂缓决定是在照顾自己，还是在逃开一个已经知道的事实？","micro_action":"列出两种选择各一个好处、一个代价和一个未知。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"swords_03","name":"宝剑三","suit":"swords","number":3,"keywords":["心痛","分离","承认"],"image_cues":"三把剑穿过一颗红心，灰色云层与雨幕铺在背景，没有人物遮挡伤口。","meaning":"宝剑三常指向心痛、失望与难以回避的分离感。它承认某些话或落差确实会伤人，但不证明背叛或任何特定事件；感受需要容纳，事实仍需核实。","positions":{"state":"若你正在为一句话、一次落空或一段距离难受，这张牌允许你承认疼痛。不必先证明自己有理，才配认真照顾感受。","need":"你需要伤心被听见，而不是立刻被劝好或要求原谅。关系中的修复可能先从承认影响开始，不急着恢复原来的样子。","obstacle":"要检查的不是你是否太敏感，而是痛苦是否被扩大成「我不值得被爱」。一个伤人的经历，不能定义你的全部价值。","resource":"可寻找能安静听你说话的人，以及让感受有所安放的文字或创作。支持不必马上给出结论，愿意陪伴已经有意义。","action":"先命名最痛的部分，是失望、被忽视，还是失去期待。等情绪稍稳，再决定是否表达影响，不用立即做关系终局判断。"},"reflection":"我真正失去的是什么，又有什么仍然属于我？","micro_action":"写三句「我难过的是……」，暂时不写任何自责结论。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"swords_04","name":"宝剑四","suit":"swords","number":4,"keywords":["休整","静默","恢复"],"image_cues":"人物雕像平躺于石台，双手合拢，三剑悬于墙上，一剑横置台侧。","meaning":"宝剑四常象征退一步休息、减少刺激与整理心绪。暂停并非放弃，也不表示关系结束；它强调在继续解释、回应或决断以前，先为自己留出恢复的余地。","positions":{"state":"你可能已经反复思考同一件事，继续讨论反而难以听清自己。此刻更值得关注的，是你的注意力与精力是否需要休息。","need":"你重视可以安心暂停的关系，不必随时在线才能证明在乎。能说明何时回来、而不被逼着即时回应，是一种具体的安全感。","obstacle":"需要检查的是，把休息误认为懒惰或冷漠，从而逼迫自己继续输出。也可留意，未说明的沉默是否让本可避免的误会增加。","resource":"资源可能是一段不被打扰的时间、安静空间与可暂缓的事项。允许自己今天少解决一个问题，比硬挤出答案更有帮助。","action":"若需要暂停沟通，给出简短说明与可行的回看时间。随后真正离开聊天界面，让身体休息，而不是换个地方继续复盘。"},"reflection":"我是在真正休息，还是一边停止回复一边不停审判自己？","micro_action":"把手机放远十分钟，喝水并做一件不需要作判断的小事。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"swords_05","name":"宝剑五","suit":"swords","number":5,"keywords":["冲突","代价","退场"],"image_cues":"一人收起数把剑，两人背向离开，地面还有弃剑，天空云层被风扯开。","meaning":"宝剑五常象征冲突后的损耗，以及争赢与关系代价之间的张力。它不把你固定成赢家或输家，而是让你检查一种争执方式是否已经背离真正想保护的东西。","positions":{"state":"你可能还在回放一次争执，想找到能彻底证明自己的那句话。此刻值得辨认的是，你想恢复尊重，还是只想不再显得落败。","need":"你需要争议中仍被当作完整的人对待，而不是被讥讽、羞辱或压倒。可讨论问题与不可接受的表达方式，需要分开来看。","obstacle":"待检查的阻力是，把让步等同认输，或把最后一句话当作尊严的全部。继续交锋未必能换来你真正想要的理解。","resource":"可寻找退出无效争论的权限、清楚的沟通底线，以及能帮助你看清代价的旁观视角。暂停攻击不等于放弃自己的立场。","action":"先决定哪种说法你不会继续接招，再用一句简短边界结束升级。等双方具备讨论条件时，只谈一个可以解决的具体问题。"},"reflection":"如果我赢了这场争论，却失去平静，我愿意付这个代价吗？","micro_action":"写下一句退场用语：「我愿意谈这件事，但不接受这样的表达。」","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf","https://marykgreer.com/2026/01/06/moving-on-with-the-six-of-swords/"]},{"id":"swords_06","name":"宝剑六","suit":"swords","number":6,"keywords":["过渡","距离","同行"],"image_cues":"渡船载着披衣乘客驶向远岸，六把剑立于船头，两侧水纹由乱转静。","meaning":"宝剑六常象征离开纷扰、缓慢过渡与借助支持前行。变化未必轻松，旧的感受也可能随身而来；重要的不是立刻快乐，而是有机会在更安稳的位置看清事情。","positions":{"state":"你可能正在离开一种消耗的相处节奏，心里却仍带着牵挂。过渡期同时有轻松与不舍，并不说明你的选择一定有错。","need":"你需要能够渐进调整的空间，也希望变化不是全靠自己硬撑。尊重距离、允许慢一点的陪伴，可能是此刻重要的关系需要。","obstacle":"需要检查的是，以为换了环境就必须马上放下全部感受。旧问题若仍有现实影响，可以带着界限处理，不必强迫自己遗忘。","resource":"可寻找可靠的同行者、一个更平静的交流场景或实际安排。有人帮助你完成过渡的小步骤，会比催你振作更实在。","action":"挑一项能降低纷扰的调整，例如延后讨论、减少无效往返或换个安静地点。先让处境更可承受，再评估更大的方向。"},"reflection":"哪一种距离能让我看得更清楚，而不是只让我躲得更远？","micro_action":"写下一个想减少的消耗和一个可以提供支持的人或地点。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf","https://marykgreer.com/2026/01/06/moving-on-with-the-six-of-swords/"]},{"id":"swords_07","name":"宝剑七","suit":"swords","number":7,"keywords":["策略","保留","诚实"],"image_cues":"人物回头望向营帐，怀抱五把剑悄然离开，另两把剑仍插在身后地面。","meaning":"宝剑七常关联策略、独自处理与选择性透露，也提醒留意回避和信息缺口。它不能证明谁在欺骗；更有用的是检查自己的保留是否出于保护，是否已有现实代价。","positions":{"state":"你可能倾向先独自想好办法，再决定透露多少。保留私人空间本身没有错，但值得分清你在保护边界，还是绕开必要对话。","need":"你需要自主决定何时、向谁表达多少，不必用全部透明换取信任。同时，你也可能重视涉及共同约定的信息能被说清。","obstacle":"待检查的阻力是，靠猜测填补空白，或以迂回方式测试关系。隐藏自己的真实问题，可能让你得到更多线索却更少理解。","resource":"资源是审慎的准备、对隐私的明确界定，以及能够核实的信息。你可以既保护个人空间，也对共同承担的事项保持诚实。","action":"先列出哪些属于你的隐私，哪些会影响双方约定。只就后一类准备一个直接问题，不查隐私、不设圈套，也不以牌定罪。"},"reflection":"我避开不说的，是合理隐私，还是一件需要共同面对的事？","micro_action":"把一个试探性问句改写成可直接回答、没有预设指责的问题。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf","https://marykgreer.com/2026/01/06/moving-on-with-the-six-of-swords/"]},{"id":"swords_08","name":"宝剑八","suit":"swords","number":8,"keywords":["受限","盲点","余地"],"image_cues":"蒙眼且被束缚的人站在浅水中，八把剑围列两侧，远方城堡高踞山上。","meaning":"宝剑八常象征受限制、看不清出口与行动余地被压缩。限制可能真实存在，也可能夹杂未经检验的判断；它不责怪困住的人，而邀请逐项辨认可动与不可动之处。","positions":{"state":"你可能感觉怎样做都不合适，连表达需要也像会带来麻烦。先承认限制的重量，再看看是否存在一个比全盘改变更小的选择。","need":"你需要拥有说不、求助和改变主意的空间，而不是靠压住自己换取关系安稳。能够实际使用的选择权，比口头许可更重要。","obstacle":"要检查的是，是否把一个障碍推广成「所有路都走不通」。也不要忽略现实中的权力与资源差距，它们并非靠想开就能消失。","resource":"可寻找具体信息、可信任的支持者，以及不依赖对方同意的小范围选择。帮助应当增加你的自主性，而不是替你作决定。","action":"把当前限制分成确实存在、尚未核实、可以求助三类。先处理一项信息缺口，不要求自己立刻跨过所有阻碍。"},"reflection":"我认为不能做的那件事，依据是明确事实还是尚未验证的担心？","micro_action":"列出三个限制，在其中一个旁边写下可核实的信息来源。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"swords_09","name":"宝剑九","suit":"swords","number":9,"keywords":["忧虑","反刍","求助"],"image_cues":"人物夜里坐起并掩面，九把剑横列黑色墙面，被褥带着玫瑰与符号图案。","meaning":"宝剑九常象征难以停止的忧虑、自责与夜间放大的念头。痛苦感受是真实的，却不能据此确认最坏情节；它提醒把孤单承担转为可表达、可获得支持的需要。","positions":{"state":"你可能一遍遍重播对话，试图找出自己哪里做错了。先注意这种思考是否只增加痛苦，而没有带来新的、可核实的信息。","need":"你需要能讲出担忧而不被嘲笑的空间，也需要不必独自承担所有责任。被耐心倾听，比被要求立刻积极更贴近此刻。","obstacle":"待检查的阻力是，把脑海中最刺痛的可能性当成事实，或把关系中的全部责任都揽给自己。强烈的担心并不是可靠证据。","resource":"可寻找白天更稳定的判断、可信任的倾听者与日常支持。若困扰持续影响生活，可以考虑合适的专业帮助，而不是继续独扛。","action":"先将担心写在纸上，标出已经发生与尚未发生的部分。暂缓深夜的重大决定，找一个清醒时段再看哪些事情真的需要行动。"},"reflection":"我现在掌握了新事实，还是只把同一个担忧想得更真实？","micro_action":"用五分钟写下担心，再给它标注「事实」或「预测」。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"swords_10","name":"宝剑十","suit":"swords","number":10,"keywords":["耗尽","终止","承认"],"image_cues":"人物俯卧于地，十把剑刺入背部，黑暗天空下的海平线透出一线亮色。","meaning":"宝剑十常象征某种模式走到极限、明显的失落与无力再撑。画面不是死亡预言；它邀请承认已经难以持续的部分，停止反复加伤，而不强迫你立刻感谢这段经历。","positions":{"state":"你可能已为同一问题努力很久，现在连解释都觉得疲惫。与其再证明自己能够撑住，不如先承认哪一部分确实已经耗尽。","need":"你需要自己的极限被尊重，不再用忍耐换取认可。即使尚未决定关系去留，也可以先提出暂停某种伤害性互动的需要。","obstacle":"需要检查的是，仍在向一个反复失效的方式索要不同结果。承认方法走不通，不等于否定你曾经投入的真心与价值。","resource":"可寻找一项能立即减少负担的支持，以及允许旧模式结束的自我许可。资源也可能只是今天不再重读那段让你受伤的对话。","action":"把「必须继续忍受」改写为一个可以停止的小行为。先恢复基本生活节奏，等有余力后再处理关系中的长期安排。"},"reflection":"什么已经到了我的极限，而我还在要求自己再撑一次？","micro_action":"今天暂停一次重复翻看旧聊天，把这段时间留给一项基本照顾。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"swords_11","name":"宝剑侍从","suit":"swords","number":11,"keywords":["好奇","警觉","求证"],"image_cues":"持剑人物站在起伏高地上，身体向前而目光回望，风吹树木与云层。","meaning":"宝剑侍从常象征敏锐观察、提问与学习辨别信息的角色品质。它鼓励好奇和求证，也提醒警觉不等于监视；宫廷角色描述一种方式，不指向特定性别或年龄的人。","positions":{"state":"你可能正密切留意语气、消息间隔与细节，想拼出关系的全貌。敏感可以帮助你提问，但单个线索不应承担完整结论。","need":"你需要可以坦然问「我是否理解对了」的关系环境。好奇受到欢迎、误解能够纠正，会比要求自己永远读懂暗示更轻松。","obstacle":"待检查的阻力是，收集太多零碎迹象却缺少可靠上下文。若观察变成反复查看动态，可能需要把注意力转回自己的生活。","resource":"可寻找清楚的提问方式、可验证的事实与愿意耐心解释的人。允许自己暂时不知道，反而能让判断少一些紧张与偏见。","action":"选一个真正重要的疑问，以开放句式求证，别一次抛出所有猜测。听到答案后再对照具体行为，而不是立即寻找新的漏洞。"},"reflection":"我是在了解事实，还是在不断寻找支持担心的细节？","micro_action":"把「这一定说明……」改写为「我还需要确认……」。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"swords_12","name":"宝剑骑士","suit":"swords","number":12,"keywords":["果断","速度","辩护"],"image_cues":"骑士举剑策马向前疾驰，树木在风中弯折，披风与云线一同扬起。","meaning":"宝剑骑士常象征迅速推进、直面问题与捍卫立场的角色品质。它带来行动的锐度，也需要方向与节制；快速说出观点，不等于已经理解彼此处境。","positions":{"state":"你可能很想马上把问题说透，迅速结束拖延和含糊。这份动力有用，但先确认你要解决的是问题，而不是摆脱等待的不适。","need":"你需要对话有回应、有方向，不希望所有矛盾都被无限搁置。明确讨论时间与主题，可能比要求立刻给出最终答案更可行。","obstacle":"需要检查的是，速度是否压过倾听，或把急切包装成唯一正确的安排。对方节奏不同，仍需要通过现实沟通了解原因。","resource":"你可以运用自己的表达力、勇气与组织思路的能力。先确定一个目标和两条事实，会比把所有不满同时推出去更有效。","action":"在发出长消息前停一下，删除攻击人格与要求立即决定的部分。保留核心问题，并询问一个双方都能认真讨论的时间。"},"reflection":"我想推进的具体事情是什么，快一点真的能帮助它吗？","micro_action":"把准备发送的长消息缩成一个事实、一个请求，先保存十分钟。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"swords_13","name":"宝剑王后","suit":"swords","number":13,"keywords":["界限","独立","洞察"],"image_cues":"王后侧坐石座，一手直立持剑，一手向前伸出，云层与远处飞鸟相伴。","meaning":"宝剑王后常象征由经验形成的洞察、独立判断与清楚界限。她并非冷漠的标签，而是提醒你可以理解别人的处境，同时不撤销自己的感受与原则。","positions":{"state":"你可能正在重新辨认哪些互动可以接受，哪些已经让你反复委屈。清楚表达界限，不必先把自己塑造成毫无情绪的人。","need":"你需要真实、尊重与可以保留独立意见的亲近。关系越重要，越值得让自己的判断留下位置，而不是用顺从代替理解。","obstacle":"待检查的阻力是，以讽刺或过度冷静保护脆弱，导致真正需要被遮住。界限可以坚定，也可以明确告诉别人什么会伤到你。","resource":"可寻找过往经验中已经学会的判断标准，以及能尊重你说不的人。你的敏锐最有帮助之处，是让规则更清楚而非更苛刻。","action":"挑出一条最重要的界限，用行为而非人格描述它。说明你愿意怎样沟通，以及遇到同样情形时你会如何照顾自己。"},"reflection":"我正在守护一条重要界限，还是用距离避免任何被看见的风险？","micro_action":"写下「我愿意……，但不接受……」，两处都填具体行为。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"swords_14","name":"宝剑国王","suit":"swords","number":14,"keywords":["原则","判断","负责"],"image_cues":"国王正坐石座，手握直立长剑，背后天空开阔，王座饰有蝶形图案。","meaning":"宝剑国王常象征以原则组织判断、清晰决策与承担后果的角色品质。理性不是忽略感受，而是让事实、规则和责任各得其位，避免用权威结束本该平等的讨论。","positions":{"state":"你可能正试着为混乱的相处建立规则，或承担决定下一步的责任。先区分你可以决定的个人边界与需要双方商议的事项。","need":"你重视一致、讲道理且愿意承担后果的互动，希望约定不会随情绪变化。也需要自己的感受能进入讨论，而非被规则排除。","obstacle":"需要检查的是，把自己的标准当成唯一标准，或急于裁定对错而忽略影响。公平不仅在于同一条规则，也在于双方能否表达。","resource":"可寻找可共同确认的约定、清晰的记录与冷静的复盘方式。让原则用于减少误解，而不是把每一次互动变成审判。","action":"选一项经常反复的争议，提出简单、对等、能实行的沟通规则。先征求对方意见，再判断这条约定是否真正服务双方。"},"reflection":"我的原则同时保护了自己与他人的表达权吗？","micro_action":"写下一条你愿意自己也遵守的沟通规则，并标注适用情境。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"pentacles_01","name":"星币一","suit":"pentacles","number":1,"keywords":["种子","落实","机会"],"image_cues":"云中手掌托起一枚星币，下方花园繁盛，小径穿过绿篱拱门通向远山。","meaning":"星币一常象征能够落实的开始、现实资源与值得培育的机会。它不是财富或关系成功的保证，而是提醒你看看哪些具体条件已经具备，怎样把愿望变成小而真实的行动。","positions":{"state":"你可能开始希望关系不只停在想象，而能落到一次见面、一项安排或一种稳定联系。留意现实中已经可用的时间与条件。","need":"你需要看得见、摸得着的在乎，例如守约、腾出时间与实际照顾。对你而言，小事能够兑现，可能比宏大的许诺更重要。","obstacle":"待检查的阻力是，只等一个完美开端，却没有照顾机会需要的条件。也别把一次善意，提前解释成已经成立的长期承诺。","resource":"可寻找现成的空闲时段、便利地点与自己能够投入的精力。一个不勉强双方的小安排，比需要牺牲很多的浪漫计划更稳妥。","action":"选一个成本低、可调整的具体尝试，让期待有机会接触现实。随后观察体验是否适合自己，不用急着将它升级为未来结论。"},"reflection":"我期待的在乎，能否被描述成一个具体而合理的行动？","micro_action":"写下一件本周可做到的关系小事，并标明所需时间。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"pentacles_02","name":"星币二","suit":"pentacles","number":2,"keywords":["调节","兼顾","弹性"],"image_cues":"人物双手各托星币，无限形带子将其连接，身后两艘船随高低海浪起伏。","meaning":"星币二常象征多项责任之间的调节、弹性与节奏管理。平衡不是每时每刻平均分配，而是在变化中重新排序；它也提醒，长期勉强维持的轻松会消耗真实余力。","positions":{"state":"你可能一边顾及关系，一边应付工作或生活安排，常在不同需要间切换。先看自己实际还能承受多少，不必继续表现得游刃有余。","need":"你需要能协商节奏的关系，不把偶尔调整安排直接当作不在乎。提前说明可用时间、允许合理变动，可能让相处更轻松。","obstacle":"需要检查的是，是否答应得太满，再靠临时补救维持表面平衡。弹性不等于永远由你迁就，也不必对所有需求同等优先。","resource":"可寻找共同日程、简化选择与可商量的分工。把一部分安排变得可预期，可以替你节省反复协调所消耗的注意力。","action":"挑出本周最挤的一天，删减或推迟一项非必要安排。若影响共同计划，提前说明并给出替代选项，不必等到最后一刻。"},"reflection":"我是真的能够兼顾，还是只是不敢承认自己已经太满？","micro_action":"将本周安排分为必须、可协商、可暂缓，先处理一项可暂缓事项。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"pentacles_03","name":"星币三","suit":"pentacles","number":3,"keywords":["合作","手艺","共建"],"image_cues":"工匠站在长凳上雕刻建筑，另两人持图交流，三枚星币排列在拱顶。","meaning":"星币三常象征通过分工、技能与反馈共同完成事情。关系不只是感情是否强烈，也包括能否一起处理实际问题；尊重各自贡献，比要求彼此样样相同更有建设性。","positions":{"state":"你可能正在关心如何把「我们」落实到共同生活或具体计划。此刻值得观察的是分工、倾听与协作，而不只是口头态度。","need":"你需要自己的投入被看见，也希望能参与讨论，而不是只接收安排。各有擅长且可以相互补位，会让你更有共同建设的感觉。","obstacle":"待检查的阻力是，默认彼此知道标准，或觉得自己做好就足够。缺少讨论的分工容易变成一方包办、另一方不知如何加入。","resource":"可寻找双方已经具备的不同技能、清楚的任务边界与具体反馈。共同完成一件小事，往往能提供比猜测更多的现实信息。","action":"选择一件可合作的小任务，先说清结果与分工，再约一个简短回看时间。反馈时说具体贡献和需要调整的地方，不评判人格。"},"reflection":"我是否给了自己与对方平等参与、提出修改意见的空间？","micro_action":"用两行写下一个共同任务：我能做什么，以及需要协商什么。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"pentacles_04","name":"星币四","suit":"pentacles","number":4,"keywords":["守护","控制","安全"],"image_cues":"人物紧抱一枚星币，头顶与双脚各有星币，身后的城市隔着空地展开。","meaning":"星币四常象征守住已有之物、寻求安全与维持控制。保护界限有其必要，但握得太紧也可能挤掉交流空间；重点在于分清稳固的基础与无法真正实现的绝对保证。","positions":{"state":"你可能特别想确认关系不会变化，因而更留意联系、安排或承诺。先看这种紧握是在带来稳定，还是让你更难放松。","need":"你需要清楚而可靠的边界，也希望自己的生活与资源不被随意占用。安全感可以来自明确约定，而不必来自掌握对方的一切。","obstacle":"需要检查的是，把分享与失去控制直接画等号，或用限制对方缓解自己的不安。保护自己的空间，不等于拥有他人的自由。","resource":"可寻找属于自己的日常支点、明确可用的时间与稳定支持。拥有不只依赖一段关系的生活结构，会让你更有选择余地。","action":"区分一条合理边界与一个无法保证的要求。先练习表达边界，并给一件不影响安全的小事留出弹性，观察真实感受。"},"reflection":"我努力守住的究竟是重要底线，还是不可能永远不变的状态？","micro_action":"写下「我能管理的」与「我不能控制的」各两项。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"pentacles_05","name":"星币五","suit":"pentacles","number":5,"keywords":["匮乏","疏离","求援"],"image_cues":"两人在风雪中艰难前行，身旁彩色窗户亮着光，五枚星币嵌在窗上。","meaning":"星币五常象征匮乏、被排除感与缺少支持的艰难处境。它不预告疾病或损失，也不要求用积极心态掩盖现实困难；重点是承认缺口，并寻找实际可及的帮助。","positions":{"state":"你可能觉得自己被留在热闹之外，或正缺少陪伴与实际支持。先确认最迫切缺少的是什么，不把处境的困难解释成个人失败。","need":"你需要在脆弱或资源不足时仍被平等对待，不必表现得有用才值得被关心。具体、可获得的支持，比空泛鼓励更贴近需要。","obstacle":"待检查的阻力是，因为羞于开口而把所有需要藏起来；也可能确实存在不易获得支持的现实障碍。两者都值得认真看见。","resource":"可寻找可信任的人、可用的公共资源与能够直接缓解负担的小帮助。支持是否真正可及，需要核实，不必假定温暖就在门后。","action":"选一项最急迫、最具体的困难，查明一个可求助的渠道或联系对象。请求可以很小，也可以只先询问能提供什么帮助。"},"reflection":"我最需要的是陪伴、休息，还是一项具体的现实支持？","micro_action":"写下一句具体求助：「我现在需要……，你是否方便……？」","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"pentacles_06","name":"星币六","suit":"pentacles","number":6,"keywords":["给予","接受","对等"],"image_cues":"一人手持天平并向两人分发钱币，六枚星币悬于上方，给予与接受并置。","meaning":"星币六常象征资源流动、给予和接受，也让人看见互动中的位置差异。善意与尊严应同时存在；帮助不必立刻等额回报，但不应成为控制、亏欠或沉默的交换。","positions":{"state":"你可能正留意谁在付出、谁在接受，以及这种安排让你感觉如何。先看长期是否可持续，不必将每次关心都换算成账目。","need":"你需要能自在接受帮助，也能在能力范围内给予的关系。支持不附带羞辱、越界或无限偿还的要求，会让你更安心。","obstacle":"需要检查的是，付出是否变成获取认可的唯一方式，或接受之后就觉得不能拒绝。感谢一个人，不代表撤销自己的全部边界。","resource":"可寻找愿意协商分工、尊重拒绝的支持，以及你已经拥有的回馈方式。时间、认真倾听与实际协助，也都是有分量的贡献。","action":"回看一项让你有压力的帮助，辨认哪些条件明确、哪些是你自行承担的亏欠。必要时说明可接受的范围，不用过度补偿。"},"reflection":"这份给予或接受，让我更有自由，还是更难表达自己的需要？","micro_action":"记下最近一次接受的帮助，再写一句不带偿还承诺的感谢。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"pentacles_07","name":"星币七","suit":"pentacles","number":7,"keywords":["等待","评估","耐心"],"image_cues":"人物倚着农具凝视藤蔓上的星币，劳作暂歇，眼前作物仍待继续生长。","meaning":"星币七常象征投入之后的等待、观察与重新评估。耐心不是无限追加付出，而是在适当节点检查成长是否真实发生，决定继续照料、调整方法，还是减少消耗。","positions":{"state":"你可能已投入不少时间，正在问这段相处究竟有没有进展。先寻找可观察的变化，而不是只用等待的长短衡量价值。","need":"你需要努力获得回应，也需要知道彼此期待是否仍相近。允许讨论进展与困难，会比要求你一直耐心而不给线索更踏实。","obstacle":"待检查的阻力是，因为已经投入很多就不敢重新评估，或因为变化缓慢就断言全无意义。过去的成本与未来的选择要分开。","resource":"可寻找一段时间内的实际记录、可辨认的小变化与明确的回看节点。让判断依靠持续行为，不只依靠某一天的特别好或坏。","action":"设一个合理的观察问题，例如约定是否更能兑现，而不是等待一句万能保证。到回看时评估自己的体验，再决定怎样调整。"},"reflection":"我继续投入，是看见了真实成长，还是只舍不得已经付出的部分？","micro_action":"记录一项近期真实改善和一项仍未变化的问题。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"pentacles_08","name":"星币八","suit":"pentacles","number":8,"keywords":["练习","专注","打磨"],"image_cues":"工匠坐在长凳上雕刻星币，成品逐一挂在木柱上，远处城镇静静矗立。","meaning":"星币八常象征重复练习、专注细节与逐渐成熟的技能。关系中的沟通和照顾也需要学习，但练习不是要求完美，更不意味着靠一个人不断改进就能解决所有问题。","positions":{"state":"你可能正认真学习怎样表达、倾听或处理分歧，想把相处做得更好。看见自己的进步，也留意努力是否只压在你一人身上。","need":"你需要愿意一起练习和调整的关系，而不是一次没做好就被否定。具体反馈、可尝试的方法与允许犯小错的空间很重要。","obstacle":"需要检查的是，把关系当成必须满分的作业，或相信只要自己足够努力就不会失落。技能可以练，别人的选择不能由你完成。","resource":"资源是你已经掌握的小技巧、可参考的沟通方法与能反馈的安全场景。持续练习一个细节，比同时纠正全部习惯更容易。","action":"只选一个可练习的动作，例如先复述再回应，或把指责改成具体请求。下一次互动试一遍，之后记录感受，不给自己打总分。"},"reflection":"我在练习一项有用技能，还是在努力变成不会让任何人失望的人？","micro_action":"用一件小事练习「我观察到……，我的感受是……，我希望……」。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"pentacles_09","name":"星币九","suit":"pentacles","number":9,"keywords":["自足","成果","自主"],"image_cues":"人物独立站在繁茂葡萄园中，手腕停着戴罩猎鹰，九枚星币散布枝间。","meaning":"星币九常象征独立积累的成果、生活品质与享受自身空间的能力。它不要求拒绝亲密，而是提醒，关系可以为生活增色，不必成为证明价值与获得满足的唯一来源。","positions":{"state":"你可能正在重新珍惜自己的节奏、空间与已经经营好的生活。独处的满足和想要亲近并不矛盾，可以同时被认真对待。","need":"你需要亲密中仍保有自主，包括独立安排、兴趣与个人选择。被欣赏的不应只是你为别人做什么，也包括你本来的生活样貌。","obstacle":"待检查的阻力是，把独立理解成不能需要任何人，或因享受自己而感到愧疚。允许依靠与保留自主，并不是非此即彼。","resource":"可寻找已经给你带来满足的习惯、兴趣与能力，记起它们如何被你一点点建立。稳定的自我生活，会让亲近成为选择而非求证。","action":"为自己的生活留一个无需别人赞许的小安排，并留意它带来的满足。之后再想你希望与人分享什么，而不是必须放弃什么。"},"reflection":"如果暂时不向任何人证明自己，我会怎样享受今天的生活？","micro_action":"安排十五分钟做一件只因自己喜欢而做、不需要展示的小事。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"pentacles_10","name":"星币十","suit":"pentacles","number":10,"keywords":["归属","传承","长久"],"image_cues":"拱门内一家人和犬只相伴，前景长者静坐，十枚星币铺展在居所场景中。","meaning":"星币十常象征长期积累、归属网络与共同生活的延续。它提醒个人关系也处在家庭、文化和日常结构中；安稳的模样不只有一种，继承的期待仍可以重新选择。","positions":{"state":"你可能开始思考长期相处、家庭意见或共同生活的样子。先看哪些期待来自自己，哪些是为了符合身边人习惯的答案。","need":"你需要可持续的归属感，以及遇到生活变化时仍能相互支持的结构。长期承诺的意义，要与自己的价值和生活方式相符。","obstacle":"需要检查的是，把外在认可当作内在安稳，或让家人、传统替自己定义幸福。共同生活的实际差异，也不应被理想画面遮住。","resource":"可寻找可靠的支持网络、值得保留的家庭经验和能公开讨论的共同价值。既有资源可以使用，不合适的旧模式也可以不延续。","action":"写出你希望长期生活保留的三种品质，再区分哪些可由自己开始建立。涉及他人的安排，留待实际协商，不从牌面代拟承诺。"},"reflection":"我想延续哪些归属经验，又想停止重复哪些旧有期待？","micro_action":"列出理想日常的三个普通细节，不使用「完美」或「应该」。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"pentacles_11","name":"星币侍从","suit":"pentacles","number":11,"keywords":["学习","踏实","尝试"],"image_cues":"人物双手托起星币专注端详，脚下草地平展，远处有树林、田野与山丘。","meaning":"星币侍从常象征认真学习、把想法落地与愿意从基础开始的角色品质。它关心小步骤是否可行，而非一次证明能力；新的相处方式可以通过低风险尝试逐渐熟悉。","positions":{"state":"你可能愿意学习一种新的相处方式，却还不知道从哪里开始。先把好奇放在一个具体细节上，不必急着表现得熟练。","need":"你需要耐心、明确的沟通与可练习的空间，希望认真尝试能被看见。允许询问基础问题，会比假装自己早就懂得更有帮助。","obstacle":"待检查的阻力是，准备太久却不敢试，或拿自己的起点和别人的熟练比较。诚恳学习很重要，但不需要靠完美来换取认可。","resource":"可寻找简明的方法、可信的示范和一个反馈友善的小场景。让学习连接实际体验，而不是不断囤积关于关系的道理。","action":"挑一个你想学会的小动作，例如清楚提出时间安排或确认对方说法。设计一次简单尝试，结束后只记录一条有用经验。"},"reflection":"我今天能学会哪一个具体动作，而不必先解决所有关系问题？","micro_action":"选一个待练习的沟通句式，先用自己的日常小事写一遍。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"pentacles_12","name":"星币骑士","suit":"pentacles","number":12,"keywords":["守约","耐性","持续"],"image_cues":"骑士骑在停稳的深色马上，手托星币向前望去，背后田地已被犁整。","meaning":"星币骑士常象征持续投入、守约与按部就班的角色品质。可靠来自重复的实际行动，而非速度或声势；它也邀请定期检视，稳定的习惯是否仍适合当下的需要。","positions":{"state":"你可能更关注一段关系能否稳定出现在日常，而不是偶尔的强烈时刻。观察连续的小行动，会比只记住一次特别表现更有帮助。","need":"你需要言行一致、节奏可预期，也重视承诺在普通日子仍被认真对待。稳定可以不热闹，但应让你感觉自己的时间被尊重。","obstacle":"需要检查的是，把坚持变成不许变化，或只顾完成责任而忘了询问真实体验。可靠不只是做同样的事，也包括愿意适度调整。","resource":"可寻找已经有效的日常习惯、清楚的可用时间与双方能做到的小约定。无需更大的保证，先让一个合理承诺持续被兑现。","action":"选择一个自己确实能坚持的小行动，并设一个回看节点。到时检查它是否有帮助；若不适合，就协商调整而不是默默硬撑。"},"reflection":"我维持的习惯是在滋养关系，还是只是因为已经做了很久？","micro_action":"给自己的一项小承诺写下明确时间，并检查是否真的留有余力。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"pentacles_13","name":"星币王后","suit":"pentacles","number":13,"keywords":["照料","舒适","实际"],"image_cues":"王后坐在花木环绕的石座上，低头托着星币，脚边草地有一只兔子。","meaning":"星币王后常象征实际照顾、安适环境与有余力的慷慨。她所代表的品质不限定性别或家庭角色；关怀既可以给予别人，也应包含自己的身体、时间与生活需要。","positions":{"state":"你可能正在用做饭、安排细节或实际帮忙表达在乎。也请看看这些照料有没有包含自己，是否让你有被滋养而不只是被需要的感觉。","need":"你需要温暖能进入日常细节，也希望自己不必永远担任照顾者。能安心休息、接受关怀、表达不方便，都是关系中的重要需要。","obstacle":"待检查的阻力是，替别人包办所有事情，或者把拒绝一次帮助理解成不够善良。照顾若长期耗尽自己，就需要重新划定范围。","resource":"可寻找舒适的空间、规律的生活支点与愿意分担的人。把支持安排得具体一点，让关怀不只依赖你临时挤出的精力。","action":"先检查今天自己的基本需要，再决定还能给予多少。选择一件能使生活更舒适的小事，也可明确请求别人承担一项细节。"},"reflection":"我给予的照顾，有没有同样留一份给自己？","micro_action":"整理一处常用小空间，或准备一杯水，先完成一项给自己的照顾。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]},{"id":"pentacles_14","name":"星币国王","suit":"pentacles","number":14,"keywords":["稳健","担当","经营"],"image_cues":"国王坐在饰有牛首的王座上，手持权杖与星币，葡萄藤和城堡围绕四周。","meaning":"星币国王常象征把经验变成稳定成果、管理资源与承担责任的角色品质。真正的可靠不靠身份或排场证明，而看能否持续照顾现实需要，同时尊重每个人的自主。","positions":{"state":"你可能正在考虑怎样让相处更稳固，包括时间安排、生活责任与长期可持续性。先关注具体落实，而不是用外在条件替代体验。","need":"你需要可以商量现实问题、愿意承担责任的关系，也希望自己的选择受到尊重。获得支持，不应意味着把决定生活的权利交出去。","obstacle":"需要检查的是，把提供资源当作主导关系的理由，或用效率掩盖情感需要。稳定的结构若无法协商，也可能让人难以呼吸。","resource":"可寻找成熟的生活经验、清楚的责任边界与可持续安排。把优势用于增加双方余地，而不是让一种成功标准压住所有差异。","action":"选择一项经常困扰日常的现实问题，整理现状、可行选择与各自责任。先提出可讨论的方案，不替别人承诺，也不急着定局。"},"reflection":"我想建立的稳定，是否也让每个人保有选择和改变的空间？","micro_action":"写下一项可改善的日常安排，以及需要先征求谁的意见。","source_urls":["https://benebellwen.com/wp-content/uploads/2013/02/a-e-waite-pictorial-key-to-the-tarot-1911-source-credit-sacredtexts.pdf"]}]</script>
<script>(()=>{'use strict';
const VERSION='1.3.0',SCHEMA_VERSION='1.0.0',KEY='next-chapter-session-v1',SAVE_KEY='next-chapter-readings-v1',MOTION_KEY='next-chapter-motion-v1';
const $=(q,r=document)=>r.querySelector(q),$$=(q,r=document)=>[...r.querySelectorAll(q)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const POS=[['state','当前关注状态','先看见此刻，暂不急着下结论。'],['need','我重视的关系需要','把模糊的期待，整理成可以表达的需要。'],['obstacle','值得检查的阻力','辨认拉扯，也为其他解释留出空间。'],['resource','可以寻找的资源','回到经验、支持与实际可用的力量。'],['action','下一步行动','选择一个低风险、能回顾的小尝试。']];
const THEMES=[['相处节奏','怎样在靠近与独处之间找到节奏','◒'],['沟通与表达','把想说的话，放到合适的位置','⌁'],['关系边界','看清我愿意给予和需要保留的部分','◈'],['关系的不确定','分清已知、感受与还不知道的事','☾']];
const HELPS=[['整理感受','先看清我在意的是什么','○'],['表达需要','寻找一次清楚而温和的开场','⇄'],['检查阻力','看看有哪些值得停下来检查的部分','◇'],['找到小行动','把思考落到一次可回顾的尝试','✦']];
const TIMES=[['接下来一周','从更小的行动开始','01'],['接下来两周','给尝试与回顾留一点空间','02'],['接下来一个月','观察节奏，循序调整','03'],['暂不设定期限','先整理，不催促自己行动','∞']];
const CONTACTS=[['还不确定／暂不说明','先做自己的整理，不默认可以联系','○'],['双方愿意平静交流','可准备一次可拒绝的小请求','⇄'],['暂停联系／对方不愿谈','不追问、不绕过拒绝或拉黑','Ⅱ'],['冲突让我不安','先照顾安全，不以沟通为任务','◇']];
const SUITS={major:'大阿卡那',cups:'圣杯',wands:'权杖',swords:'宝剑',pentacles:'星币'};
const DEMO_NAMES=['月亮','圣杯二','宝剑二','星币三','节制'];
let raw;try{raw=JSON.parse($('#cards-data').textContent)}catch{raw=[]}
const asText=x=>typeof x==='string'?x:Array.isArray(x)?x.join('；'):x&&typeof x==='object'?Object.values(x).filter(y=>typeof y==='string').join('；'):'';
const CARDS=(Array.isArray(raw)?raw:raw.cards||[]).map(c=>({...c,card_id:c.card_id||c.id,meaning:asText(c.meaning),image_cues:asText(c.image_cues),reflection:asText(c.reflection),micro_action:asText(c.micro_action),keywords:Array.isArray(c.keywords)?c.keywords:[],source_urls:Array.isArray(c.source_urls)?c.source_urls:[],positions:Object.fromEntries(POS.map(([k])=>[k,asText(c.positions?.[k])]))}));
const byId=new Map(CARDS.map(c=>[c.card_id,c]));
function audit(){let errors=[];const counts=Object.fromEntries(Object.keys(SUITS).map(k=>[k,CARDS.filter(c=>c.suit===k).length]));if(CARDS.length!==78)errors.push('完整牌库应为78张');if(byId.size!==CARDS.length)errors.push('牌ID重复');for(const [s,n]of Object.entries(counts))if(n!==(s==='major'?22:14))errors.push(s+'分类数错误');for(const c of CARDS){if(!c.card_id||!c.name||!c.meaning||!c.image_cues||!c.reflection||!c.micro_action||!c.source_urls.length||c.keywords.length<1||POS.some(([k])=>!c.positions[k]))errors.push((c.name||c.card_id)+'内容不完整');const min=c.suit==='major'?0:1,max=c.suit==='major'?21:14;if(!Number.isInteger(c.number)||c.number<min||c.number>max)errors.push(c.name+'编号错误')}for(const s of Object.keys(SUITS)){const ns=CARDS.filter(c=>c.suit===s).map(c=>c.number);if(new Set(ns).size!==ns.length)errors.push(s+'编号重复')}return{ok:!errors.length,count:CARDS.length,counts,errors}}
const AUDIT=audit(),DEMO=DEMO_NAMES.map(n=>CARDS.find(c=>c.name===n)?.card_id).filter(Boolean);
